<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>CAN Mac Analyzer</title>

║  版本号格式：vX.Y.Z                                            ║
║  日期格式：YYYY-MM-DD HH:MM                                   ║
╚══════════════════════════════════════════════════════════════╝

<script>
/* ============================================================
 * CAN Mac Analyzer - 版本配置
 * ⚠️ 每次代码修改都必须更新 VERSION 和 BUILD_DATE
 * ============================================================ */
var APP_VERSION = "v1.0.1";
var BUILD_DATE = "2026-08-17 16:25";
/* ============================================================ */
</script>
<script src="https://cdn.jsdelivr.net/npm/pako@2.1.0/dist/pako.min.js"></script>
<style>
/* ============================================================
 * CAN Mac Analyzer - 全局样式
 * CANoe风格布局，标准浏览器页面
 * ⚠️ 任何样式改动都必须同步更新版本号和日期时间
 * ============================================================ */
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --sidebar-w:260px;
  --header-h:40px;
  --toolbar-h:36px;
  --status-h:24px;
  --accent:#007AFF;--accent2:#0A84FF;
  --bg:#1C1C1E;--bg2:#2C2C2E;--bg3:#3A3A3C;
  --bg-sidebar:#1C1C1E;--bg-row:#2C2C2E;
  --text:#E5E5EA;--text2:#AEAEB2;--text3:#8E8E93;
  --border:#38383A;--border2:#48484A;
  --blue:#0A84FF;--green:#30D158;--red:#FF453A;--orange:#FF9F0A;--yellow:#FFD60A;--purple:#BF5AF2;--teal:#64D2FF;--pink:#FF375F;
  --row-h:24px;
}
html,body{height:100%;overflow:hidden;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,'SF Pro Text','Helvetica Neue',Arial,sans-serif;font-size:13px;-webkit-font-smoothing:antialiased}
body{display:flex;flex-direction:column}
button{font-family:inherit;cursor:pointer}
input,select{font-family:inherit}

/* 顶部标题栏 */
.header{height:var(--header-h);background:var(--bg2);border-bottom:1px solid var(--border);display:flex;align-items:center;padding:0 12px;flex-shrink:0}
.header-logo{font-size:15px;font-weight:700;color:var(--text);display:flex;align-items:center;gap:6px}
.header-logo .icon{color:var(--blue);font-size:18px}
.header-ver{font-size:10px;color:var(--text3);margin-left:8px}
.header-right{margin-left:auto;display:flex;align-items:center;gap:8px;font-size:11px;color:var(--text3)}
.header-right .ver{color:var(--blue);font-weight:600}

/* 工具栏 */
.toolbar{height:var(--toolbar-h);background:var(--bg2);border-bottom:1px solid var(--border);display:flex;align-items:center;padding:0 8px;gap:4px;flex-shrink:0}
.tb{height:26px;padding:0 10px;border-radius:4px;border:1px solid var(--border);background:var(--bg3);color:var(--text);font-size:11px;display:flex;align-items:center;gap:4px;transition:background .1s}
.tb:hover{background:var(--border)}
.tb:active{background:var(--border2)}
.tb.on{background:var(--blue);border-color:var(--blue);color:#fff}
.tb:disabled{opacity:.4;cursor:default;pointer-events:none}
.tb-sep{width:1px;height:20px;background:var(--border);margin:0 2px;flex-shrink:0}
.tb-stats{margin-left:auto;font-size:11px;color:var(--text3);display:flex;gap:10px}
.tb-stats b{color:var(--text);font-weight:600}

/* 主区域 */
.main{flex:1;display:flex;overflow:hidden}

/* 左侧面板 - 报文/信号列表 */
.panel-left{width:var(--sidebar-w);background:var(--bg-sidebar);border-right:1px solid var(--border);display:flex;flex-direction:column;flex-shrink:0}
.panel-search{padding:6px;border-bottom:1px solid var(--border)}
.panel-search input{width:100%;height:24px;background:var(--bg3);border:1px solid var(--border);border-radius:4px;padding:0 8px;color:var(--text);font-size:11px;outline:none}
.panel-search input:focus{border-color:var(--blue)}
.panel-search input::placeholder{color:var(--text3)}
.panel-tabs{display:flex;border-bottom:1px solid var(--border);background:var(--bg2)}
.panel-tab{flex:1;padding:5px 0;text-align:center;font-size:10px;color:var(--text3);cursor:pointer;border-bottom:2px solid transparent}
.panel-tab.on{color:var(--blue);border-bottom-color:var(--blue)}
.panel-list{flex:1;overflow-y:auto}

/* 报文行 */
.msg-row{display:flex;align-items:center;height:var(--row-h);padding:0 8px;cursor:pointer;border-left:2px solid transparent;font-size:11px}
.msg-row:hover{background:rgba(255,255,255,.04)}
.msg-row.on{background:rgba(10,132,255,.15);border-left-color:var(--blue)}
.msg-dot{width:6px;height:6px;border-radius:50%;flex-shrink:0;margin-right:6px}
.msg-id{font-family:'SF Mono',Menlo,Consolas,monospace;font-size:11px;color:var(--blue);width:70px;flex-shrink:0;font-weight:600}
.msg-name{flex:1;font-size:11px;color:var(--text2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.msg-cnt{font-size:10px;color:var(--text3);margin-left:4px;flex-shrink:0}

/* 信号行 */
.sig-row{display:flex;align-items:center;height:22px;padding:0 8px 0 20px;cursor:pointer;font-size:10px}
.sig-row:hover{background:rgba(255,255,255,.04)}
.sig-dot{width:5px;height:5px;border-radius:50%;flex-shrink:0;margin-right:5px}
.sig-name{flex:1;color:var(--text2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sig-val{font-family:'SF Mono',Menlo,Consolas,monospace;color:var(--blue);flex-shrink:0;margin-left:4px}

/* 右侧主视图 */
.view-right{flex:1;display:flex;flex-direction:column;overflow:hidden}
.view-tabs{display:flex;background:var(--bg2);border-bottom:1px solid var(--border);flex-shrink:0}
.view-tab{padding:6px 14px;font-size:11px;color:var(--text3);cursor:pointer;border-bottom:2px solid transparent}
.view-tab.on{color:var(--blue);border-bottom-color:var(--blue)}
.view-body{flex:1;overflow:hidden}
.view-panel{display:none;height:100%}
.view-panel.on{display:flex;flex-direction:column}

/* 波形区 */
.chart-wrap{flex:1;overflow-y:auto;padding:6px;background:#171717}
.chart-box{border:1px solid var(--border);border-radius:4px;margin-bottom:6px;background:var(--bg2);overflow:hidden}
.chart-hdr{display:flex;align-items:center;height:24px;padding:0 8px;background:var(--bg3);border-bottom:1px solid var(--border);gap:6px}
.chart-hdr .sig-name{font-size:10px;font-weight:600}
.chart-hdr .sig-val{font-size:10px;font-family:'SF Mono',Menlo,Consolas,monospace;color:#fff;margin-left:auto}
.chart-cv{height:100px;position:relative}
.chart-cv canvas{display:block;width:100%;height:100%}

/* 数据表 */
.data-wrap{flex:1;overflow:auto;padding:4px}
table.dt{width:100%;border-collapse:collapse;font-size:11px}
table.dt th{background:var(--bg3);padding:4px 8px;text-align:left;color:var(--text3);font-size:9px;text-transform:uppercase;border-bottom:1px solid var(--border);position:sticky;top:0}
table.dt td{padding:3px 8px;border-bottom:1px solid rgba(255,255,255,.03);font-family:'SF Mono',Menlo,Consolas,monospace;font-size:10px;height:var(--row-h)}
table.dt tr:hover td{background:rgba(255,255,255,.03)}
.c-time{color:#5856D6}.c-id{color:var(--blue);font-weight:600}.c-hex{color:#FF9F0A}.c-sig{color:#30D158}

/* 协议视图 */
.proto-wrap{flex:1;overflow-y:auto;padding:8px}
.proto-card{border:1px solid var(--border);border-radius:4px;margin-bottom:6px;background:var(--bg2);overflow:hidden}
.proto-hdr{display:flex;align-items:center;padding:6px 10px;background:var(--bg3);border-bottom:1px solid var(--border);gap:8px;font-size:12px}
.proto-hdr .pid{color:var(--blue);font-weight:700;font-family:'SF Mono',Menlo,Consolas,monospace}
.proto-hdr .pname{flex:1;color:var(--text)}
.proto-hdr .pmeta{font-size:10px;color:var(--text3)}
table.pt{width:100%;border-collapse:collapse;font-size:10px}
table.pt th{padding:4px 8px;text-align:left;color:var(--text3);font-size:8px;text-transform:uppercase;border-bottom:1px solid var(--border);background:var(--bg3)}
table.pt td{padding:3px 8px;border-bottom:1px solid rgba(255,255,255,.02)}

/* 状态栏 */
.statusbar{height:var(--status-h);background:var(--bg2);border-top:1px solid var(--border);display:flex;align-items:center;padding:0 10px;font-size:10px;color:var(--text3);flex-shrink:0;gap:12px}
.statusbar .right{margin-left:auto;display:flex;gap:10px}
.statusbar .ver{color:var(--blue);font-weight:600}

/* 空状态 */
.empty{display:flex;flex-direction:column;align-items:center;justify-content:center;height:100%;color:var(--text3);gap:4px}
.empty .ico{font-size:36px;opacity:.3}
.empty .t1{font-size:12px}.empty .t2{font-size:10px;color:var(--text3)}

/* 拖拽 */
.drop-mask{position:fixed;inset:0;background:rgba(10,132,255,.12);border:2px dashed var(--blue);z-index:999;display:none;align-items:center;justify-content:center}
.drop-mask.show{display:flex}
.drop-mask span{font-size:18px;color:var(--blue);font-weight:600;background:var(--bg);padding:16px 32px;border-radius:8px}

/* 弹窗 */
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:999;display:none;align-items:center;justify-content:center}
.modal-bg.show{display:flex}
.modal{background:var(--bg2);border:1px solid var(--border);border-radius:8px;padding:16px;min-width:300px;max-width:90vw;box-shadow:0 8px 32px rgba(0,0,0,.5)}
.modal h3{font-size:14px;margin-bottom:10px}
.modal p{font-size:12px;color:var(--text2);line-height:1.6;margin-bottom:12px}
.modal-btns{display:flex;gap:6px;justify-content:flex-end}
.modal-btns button{padding:6px 16px;border-radius:4px;border:1px solid var(--border);background:var(--bg3);color:var(--text);font-size:11px}
.modal-btns .primary{background:var(--blue);border-color:var(--blue);color:#fff}
</style>
</head>
<body>

<!-- 标题栏 -->
<div class="header">
  <div class="header-logo"><span class="icon">◈</span> CAN Mac Analyzer</div>
  <div class="header-right">
    <span class="ver" id="hVer"></span>
    <span id="hDate"></span>
  </div>
</div>

  <button class="tb" id="btnOpen" onclick="document.getElementById('fIn').click()">📂 打开</button>

</div>

<!-- 主区域 -->
<div class="main">
  <!-- 左侧面板 -->
  <div class="panel-left">
    <div class="panel-search"><input id="searchBox" placeholder="🔍 搜索..." oninput="doFilter()"></div>
    <div class="panel-tabs">
      <div class="panel-tab on" onclick="tabSide(this,'msg')">报文</div>

    </div>
  </div>

  <!-- 右侧视图 -->
  <div class="view-right">
    <div class="view-tabs">
      <div class="view-tab on" onclick="tabView(this,'chart')">📈 波形</div>
      <div class="view-tab" onclick="tabView(this,'data')">📋 数据</div>
      <div class="view-tab" onclick="tabView(this,'proto')">📖 协议</div>
    </div>
    <div class="view-body">
      <div class="view-panel on" id="vChart">
        <div class="chart-wrap" id="cArea">
          <div class="empty"><div class="ico">📈</div><div class="t1">暂无波形</div><div class="t2">加载ASC/BLF + DBC后点击解析</div></div>
        </div>
      </div>
      <div class="view-panel" id="vData">
        <div class="data-wrap">
          <table class="dt"><thead><tr><th>时间</th><th>CH</th><th>ID</th><th>DLC</th><th>数据</th><th>周期</th><th>信号</th></tr></thead><tbody id="dTb"></tbody></table>
        </div>

          <div class="empty"><div class="ico">📖</div><div class="t1">暂无协议</div><div class="t2">加载DBC文件</div></div>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- 状态栏 -->
<div class="statusbar">
  <span id="stInfo">就绪</span>
  <div class="right">
    <span class="ver" id="stVer"></span>
    <span id="stDate"></span>
  </div>
</div>

<!-- 拖拽遮罩 -->
<div class="drop-mask" id="dropMask"><span>📁 拖放文件到此处</span></div>

<!-- 弹窗 -->
<div class="modal-bg" id="mBg"><div class="modal"><h3 id="mT">提示</h3><p id="mB"></p><div class="modal-btns"><button class="primary" onclick="mClose()">确定</button></div></div></div>

<script>
/* ============================================================
 * CAN Mac Analyzer - 核心逻辑
 * ⚠️ 任何代码改动都必须同步更新文件顶部的 VERSION 和 BUILD_DATE
 * ============================================================ */

// === 版本 ===
(function(){document.getElementById('hVer').textContent=APP_VERSION;document.getElementById('hDate').textContent=BUILD_DATE;document.getElementById('stVer').textContent='CAN Mac '+APP_VERSION;document.getElementById('stDate').textContent=BUILD_DATE;})();

// === 状态 ===
var S={asc:[],dbc:[],msgs:{},defs:{},frames:[],sel:null,colors:{},ci:0,parsed:false};
var C=['#0A84FF','#FF453A','#30D158','#FF9F0A','#BF5AF2','#64D2FF','#FF375F','#FFD60A','#5856D6','#34C759','#FF6482','#AC8E68','#E5E5EA'];

// === DBC解析 ===
function parseDBC(t){
    var d={},lines=t.split('\n'),cur=null,vt={};
    for(var i=0;i<lines.length;i++){
        var l=lines[i].trim();if(!l||l[0]==='/')continue;
        var bm=l.match(/^BO_\s+(\d+)\s+(\w+)\s*:\s*(\d+)\s+(\w+)/);
        if(bm){var id=parseInt(bm[1]);if(id>=0x80000000)id-=0x80000000;cur={id:id,name:bm[2],dlc:parseInt(bm[3]),sender:bm[4],sigs:[]};d[id]=cur;continue;}
        var sm=l.match(/^SG_\s+(\w+)\s*:\s*(\d+)\|(\d+)@([01])([+-])\s*\(([^,]+),([^)]+)\)\s*\[([^|]+)\|([^\]]+)\]\s*"([^"]*)"\s*(.*)/);
        if(sm&&cur){cur.sigs.push({n:sm[1],sb:parseInt(sm[2]),bl:parseInt(sm[3]),bo:parseInt(sm[4]),sg:sm[5],fc:parseFloat(sm[6]),of:parseFloat(sm[7]),mn:parseFloat(sm[8]),mx:parseFloat(sm[9]),u:sm[10],rx:sm[11].trim()});continue;}
        var vm=l.match(/^VAL_\s+(\d+)\s+(\w+)\s+(.*?)\s*;/);
        if(vm){var mi=parseInt(vm[1]);if(mi>=0x80000000)mi-=0x80000000;var vp=vm[3].match(/(\d+)\s+"([^"]+)"/g);if(vp){var o={};for(var j=0;j<vp.length;j++){var pm=vp[j].match(/(\d+)\s+"([^"]+)"/);if(pm)o[parseInt(pm[1])]=pm[2];}if(!vt[mi])vt[mi]={};vt[mi][vm[2]]=o;}continue;}
        var cm=l.match(/^CM_\s+BO_\s+(\d+)\s+"([^"]*)"/);
        if(cm){var ci=parseInt(cm[1]);if(ci>=0x80000000)ci-=0x80000000;if(d[ci])d[ci].cm=cm[2];}
    }
    for(var k in vt)if(d[k])d[k].vt=vt[k];return d;
}

// === ASC解析 ===
function parseASC(t){
    var f=[],ls=t.split('\n'),bt=0,hb=false;
    for(var i=0;i<ls.length;i++){var l=ls[i].trim();if(!l||l[0]==='/')continue;
        var m=l.match(/^(\d+\.?\d*)\s+(\d+)\s+([0-9A-Fa-f]+)[xX]?\s+(\d+)\s+((?:[0-9A-Fa-f]{2}\s*)+)/);
        if(!m)m=l.match(/^(\d+\.?\d*)\s+CAN\s+(\d+)\s+([0-9A-Fa-f]+)\s+(\d+)\s+((?:[0-9A-Fa-f]{2}\s*)+)/);
        if(m){var tm=parseFloat(m[1]),ch=parseInt(m[2]),id=parseInt(m[3],16),dl=parseInt(m[4]),d=m[5].trim().split(/\s+/).map(function(h){return parseInt(h,16);});if(!hb){bt=tm;hb=true;}f.push({t:tm-bt,id:id,ch:ch,dl:dl,d:d});}
    }return f;
}

// === BLF解析 ===
function parseBLF(buf){
    var f=[];if(buf.byteLength<144)return f;
    var v=new DataView(buf),sig='';for(var i=0;i<4;i++)sig+=String.fromCharCode(v.getUint8(i));
    if(sig!=='BLF0')return f;
    var pos=144;
    while(pos<buf.byteLength-16){
        if(pos+4>buf.byteLength)break;
        if(String.fromCharCode(v.getUint8(pos),v.getUint8(pos+1),v.getUint8(pos+2),v.getUint8(pos+3))!=='LOBJ'){pos++;continue;}
        var hl=v.getUint16(pos+4,true),ot=v.getUint16(pos+8,true),ol=v.getUint32(pos+12,true);
        if(ol<16||ol>1e6||pos+ol>buf.byteLength){pos+=4;continue;}
        if(ot===1){var cm=v.getUint16(pos+hl,true),cs=v.getUint32(pos+hl+8,true);
            if(cs>0&&pos+hl+12+cs<=buf.byteLength){try{var cd=new Uint8Array(buf,pos+hl+12,cs);var dd=(cm===2&&typeof pako!=='undefined')?pako.inflate(cd):cd;f=f.concat(blfSub(dd));}catch(e){}}
        }
        pos+=ol;pos=(pos+3)&~3;
    }return f;
}
function blfSub(d){
    var f=[],pos=0;
    while(pos<d.length-16){
        if(String.fromCharCode(d[pos],d[pos+1],d[pos+2],d[pos+3])!=='LOBJ'){pos++;continue;}
        var hl=d[pos+4]|(d[pos+5]<<8),ot=d[pos+8]|(d[pos+9]<<8),ol=d[pos+12]|(d[pos+13]<<8)|(d[pos+14]<<16)|(d[pos+15]<<24);
        if(ol<16||pos+ol>d.length){pos+=4;continue;}
        if(ot===73){var ts=new DataView(d.buffer,d.byteOffset+pos,d.length-pos).getFloat64(hl,true),ch=d[pos+hl+8],dl=d[pos+hl+10],id=d[pos+hl+12]|(d[pos+hl+13]<<8)|(d[pos+hl+14]<<16)|(d[pos+hl+15]<<24);if(id>=0x80000000)id-=0x80000000;var dd=[];for(var j=0;j<dl&&j<8;j++)dd.push(d[pos+hl+16+j]);f.push({t:ts/1e9,id:id,ch:ch,dl:dl,d:dd});}
        pos+=ol;pos=(pos+3)&~3;
    }return f;
}

// === 信号解码 ===
function decSig(data,sig){
    var raw=extBits(data,sig.sb,sig.bl,sig.bo);
    if(sig.sg==='-'&&raw>=(1<<(sig.bl-1)))raw-=(1<<sig.bl);
    return raw*sig.fc+sig.of;
}
function extBits(data,start,len,bo){
    var val=0;
    if(bo===1){for(var i=0;i<len;i++){var bp=start+i,bi=bp>>3,bb=bp&7;if(bi<data.length)val|=((data[bi]>>bb)&1)<<i;}}
    else{for(var i=0;i<len;i++){var bp=start-i;if(bp<0)bp+=8*((-bp>>3)+1);var bi=bp>>3,bb=bp&7;if(bi<data.length)val=(val<<1)|((data[bi]>>bb)&1);}}
    return val;
}

// === 文件处理 ===
document.getElementById('fIn').addEventListener('change',function(e){procFiles(Array.from(e.target.files));});
function procFiles(files){
    var pend=files.length;if(!pend)return;
    files.forEach(function(f){
        var ext=f.name.split('.').pop().toLowerCase();
        if(ext==='dbc'){var r=new FileReader();r.onload=function(e){var d=parseDBC(e.target.result);for(var k in d)S.defs[k]=d[k];S.dbc.push(f.name);updSt();if(!--pend)ready();};r.readAsText(f);}
        else if(ext==='asc'||ext==='txt'||ext==='csv'){var r2=new FileReader();r2.onload=function(e){S.frames=S.frames.concat(parseASC(e.target.result));S.asc.push(f.name);updSt();if(!--pend)ready();};r2.readAsText(f);}
        else if(ext==='blf'){var r3=new FileReader();r3.onload=function(e){S.frames=S.frames.concat(parseBLF(e.target.result));S.asc.push(f.name);updSt();if(!--pend)ready();};r3.readAsArrayBuffer(f);}
        else{pend--;if(!pend)ready();}
    });
}
function ready(){document.getElementById('btnGo').disabled=!(S.frames.length>0||Object.keys(S.defs).length>0);}
function updSt(){document.getElementById('stInfo').textContent='ASC:'+S.asc.length+' DBC:'+S.dbc.length+' 帧:'+S.frames.length;}

// === 拖拽 ===
var dc=0;
document.addEventListener('dragenter',function(e){e.preventDefault();dc++;document.getElementById('dropMask').classList.add('show');});
document.addEventListener('dragleave',function(e){e.preventDefault();dc--;if(dc<=0){document.getElementById('dropMask').classList.remove('show');dc=0;}});
document.addEventListener('dragover',function(e){e.preventDefault();});
document.addEventListener('drop',function(e){e.preventDefault();document.getElementById('dropMask').classList.remove('show');dc=0;if(e.dataTransfer.files.length)procFiles(Array.from(e.dataTransfer.files));});

// === 解析 ===
function doParse(){
    if(!S.frames.length&&!Object.keys(S.defs).length){mShow('提示','请先加载文件');return;}
    S.frames.sort(function(a,b){return a.t-b.t;});
    S.msgs={};
    S.frames.forEach(function(f){
        if(!S.msgs[f.id]){var d=S.defs[f.id];S.msgs[f.id]={id:f.id,name:d?d.name:'Unknown',dl:f.dl,sigs:d?d.sigs:[],vt:d?d.vt:null,frames:[],cnt:0};}
        S.msgs[f.id].frames.push(f);S.msgs[f.id].cnt++;
    });
    S.parsed=true;document.getElementById('btnCsv').disabled=false;
    var ui=Object.keys(S.msgs).length,sc=0;for(var m in S.msgs)sc+=S.msgs[m].sigs.length;
    var dur=S.frames.length>0?S.frames[S.frames.length-1].t-S.frames[0].t:0;
    document.getElementById('sF').textContent=S.frames.length;document.getElementById('sI').textContent=ui;
    document.getElementById('sS').textContent=sc;document.getElementById('sD').textContent=dur.toFixed(2)+'s';
    renderSide();renderProto();
    var first=Object.keys(S.msgs)[0];if(first)selMsg(parseInt(first));
    mShow('解析完成','共 '+S.frames.length+' 帧，'+ui+' 个ID，'+sc+' 个信号');
}

// === 侧边栏 ===
function renderSide(){var c=document.getElementById('pList');var tb=document.querySelector('.panel-tab.on').dataset?document.querySelector('.panel-tab.on'):document.querySelector('.panel-tab');if(c.dataset&&c.dataset.tab==='sig')renderSig(c);else renderMsg(c);}
function renderMsg(c){
    var h='',sorted=Object.values(S.msgs).sort(function(a,b){return a.id-b.id;});
    sorted.forEach(function(m){var col=C[m.id%C.length],hx=m.id.toString(16).toUpperCase(),on=S.sel===m.id?' on':'';h+='<div class="msg-row'+on+'" onclick="selMsg('+m.id+')" data-id="'+m.id+'"><div class="msg-dot" style="background:'+col+'"></div><div class="msg-id">0x'+hx+'</div><div class="msg-name">'+m.name+'</div><div class="msg-cnt">'+m.cnt+'</div></div>';});
    c.innerHTML=h;
}
function renderSig(c){
    var h='';for(var mid in S.msgs){S.msgs[mid].sigs.forEach(function(s,idx){var col=C[(parseInt(mid)+idx)%C.length];var last=S.msgs[mid].frames.length?decSig(S.msgs[mid].frames[S.msgs[mid].frames.length-1].d,s).toFixed(3):'--';h+='<div class="sig-row" onclick="selMsg('+mid+')"><div class="sig-dot" style="background:'+col+'"></div><div class="sig-name">'+s.n+'</div><div class="sig-val">'+last+(s.u?' '+s.u:'')+'</div></div>';});}
    c.innerHTML=h||'<div class="empty" style="height:200px"><div class="t2">无信号</div></div>';
}
function doFilter(){var q=document.getElementById('searchBox').value.toLowerCase();document.querySelectorAll('#pList .msg-row,#pList .sig-row').forEach(function(el){el.style.display=el.textContent.toLowerCase().indexOf(q)>=0?'':'none';});}
function tabSide(el){document.querySelectorAll('.panel-tab').forEach(function(t){t.classList.remove('on');});el.classList.add('on');el.dataset.tab=el.textContent==='信号'?'sig':'msg';renderSide();}

// === 报文选择 ===
function selMsg(id){
    S.sel=id;document.querySelectorAll('.msg-row').forEach(function(el){el.classList.toggle('on',parseInt(el.dataset.id)===id);});
    var m=S.msgs[id];if(!m)return;renderCharts(m);renderDT(m);
}

// === 波形 ===
function renderCharts(m){
    var a=document.getElementById('cArea');
    if(!m.sigs||!m.sigs.length){a.innerHTML='<div class="empty"><div class="ico">📈</div><div class="t1">无信号定义</div><div class="t2">加载对应DBC文件</div></div>';return;}
    var h='';m.sigs.forEach(function(s,idx){var col=C[(m.id+idx)%C.length],cid='cv_'+m.id+'_'+idx;var last=m.frames.length?decSig(m.frames[m.frames.length-1].d,s).toFixed(3):'--';h+='<div class="chart-box"><div class="chart-hdr"><span class="sig-name" style="color:'+col+'">● '+s.n+'</span><span class="sig-val">'+last+' '+s.u+'</span></div><div class="chart-cv"><canvas id="'+cid+'"></canvas></div></div>';});
    a.innerHTML=h;
    m.sigs.forEach(function(s,idx){var cv=document.getElementById('cv_'+m.id+'_'+idx);if(cv)drawCv(cv,m,s,C[(m.id+idx)%C.length]);});
}
function drawCv(canvas,msg,sig,color){
    var r=canvas.parentElement.getBoundingClientRect(),dpr=window.devicePixelRatio||1;
    canvas.width=r.width*dpr;canvas.height=r.height*dpr;canvas.style.width=r.width+'px';canvas.style.height=r.height+'px';
    var ctx=canvas.getContext('2d');ctx.scale(dpr,dpr);var W=r.width,H=r.height;
    var pts=[],mn=Infinity,mx=-Infinity;
    msg.frames.forEach(function(f){var v=decSig(f.d,sig);pts.push({t:f.t,v:v});if(v<mn)mn=v;if(v>mx)mx=v;});
    if(!pts.length)return;if(mn===mx){mn-=1;mx+=1;}var rng=mx-mn;mn-=rng*.1;mx+=rng*.1;rng=mx-mn;
    var pl=46,pr=6,pt=6,pb=16,pW=W-pl-pr,pH=H-pt-pb;
    var t0=pts[0].t,t1=pts[pts.length-1].t,tR=t1-t0||1;
    ctx.fillStyle='#171717';ctx.fillRect(0,0,W,H);
    ctx.strokeStyle='rgba(255,255,255,.04)';ctx.lineWidth=1;
    for(var i=0;i<=4;i++){var y=pt+(pH/4)*i;ctx.beginPath();ctx.moveTo(pl,y);ctx.lineTo(W-pr,y);ctx.stroke();}
    ctx.fillStyle='#636366';ctx.font='9px -apple-system,sans-serif';ctx.textAlign='right';
    for(var i=0;i<=4;i++)ctx.fillText((mx-(rng/4)*i).toFixed(1),pl-4,pt+(pH/4)*i+3);
    ctx.textAlign='center';for(var i=0;i<=5;i++)ctx.fillText((t0+(tR/5)*i).toFixed(2)+'s',pl+(pW/5)*i,H-2);
    ctx.strokeStyle=color;ctx.lineWidth=1.5;ctx.beginPath();var ok=false;
    pts.forEach(function(p){var x=pl+((p.t-t0)/tR)*pW,y=pt+((mx-p.v)/rng)*pH;if(!ok){ctx.moveTo(x,y);ok=true;}else ctx.lineTo(x,y);});
    ctx.stroke();
    ctx.lineTo(pl+pW,pt+pH);ctx.lineTo(pl,pt+pH);ctx.closePath();ctx.fillStyle=color+'14';ctx.fill();
}

// === 数据表 ===
function renderDT(m){
    var tb=document.getElementById('dTb'),h='',df=m.frames.slice(-200);
    df.forEach(function(f){
        var hex=f.d.map(function(b){return('0'+b.toString(16).toUpperCase()).slice(-2);}).join(' ');
        var sv='';if(m.sigs.length){m.sigs.forEach(function(s,idx){var v=decSig(f.d,s),d=v.toFixed(2);if(m.vt&&m.vt[s.n]&&m.vt[s.n][Math.round(v)])d=m.vt[s.n][Math.round(v)];sv+=(idx>0?', ':'')+s.n+'='+d;});}
        var per='',fi=m.frames.indexOf(f);if(fi>0)per=((f.t-m.frames[fi-1].t)*1000).toFixed(1)+'ms';
        h+='<tr><td class="c-time">'+f.t.toFixed(6)+'</td><td>'+f.ch+'</td><td class="c-id">0x'+f.id.toString(16).toUpperCase()+'</td><td>'+f.dl+'</td><td class="c-hex">'+hex+'</td><td>'+per+'</td><td class="c-sig">'+sv+'</td></tr>';
    });tb.innerHTML=h;
}

// === 协议 ===
function renderProto(){
    var v=document.getElementById('pView'),h='';
    Object.values(S.defs).sort(function(a,b){return a.id-b.id;}).forEach(function(m){
        var hx=m.id.toString(16).toUpperCase();
        h+='<div class="proto-card"><div class="proto-hdr"><span class="pid">0x'+hx+'</span><span class="pname">'+m.name+'</span><span class="pmeta">DLC:'+m.dl+(m.sender?' | '+m.sender:'')+'</span></div>';
        if(m.sigs.length){h+='<table class="pt"><thead><tr><th>信号</th><th>起始</th><th>长度</th><th>字节序</th><th>因子</th><th>偏移</th><th>范围</th><th>单位</th></tr></thead><tbody>';m.sigs.forEach(function(s){h+='<tr><td>'+s.n+'</td><td>'+s.sb+'</td><td>'+s.bl+'</td><td>'+(s.bo===1?'Intel':'Moto')+'</td><td>'+s.fc+'</td><td>'+s.of+'</td><td>['+s.mn+'|'+s.mx+']</td><td>'+s.u+'</td></tr>';});h+='</tbody></table>';}else h+='<div style="padding:8px;color:#636366;font-size:10px">无信号</div>';
        h+='</div>';
    });
    if(!h)h='<div class="empty"><div class="ico">📖</div><div class="t1">暂无协议</div></div>';
    v.innerHTML=h;
}

// === 视图切换 ===
function tabView(el,name){
    document.querySelectorAll('.view-tab').forEach(function(t){t.classList.remove('on');});el.classList.add('on');
    document.querySelectorAll('.view-panel').forEach(function(p){p.classList.remove('on');});
    document.getElementById('v'+name.charAt(0).toUpperCase()+name.slice(1)).classList.add('on');
}

// === 工具 ===
function doClear(){
    S={asc:[],dbc:[],msgs:{},defs:{},frames:[],sel:null,colors:{},ci:0,parsed:false};
    ['sF','sI','sS'].forEach(function(id){document.getElementById(id).textContent='0';});
    document.getElementById('sD').textContent='0s';document.getElementById('btnGo').disabled=true;document.getElementById('btnCsv').disabled=true;
    document.getElementById('pList').innerHTML='<div class="empty" style="height:200px"><div class="ico">📋</div><div class="t2">打开文件开始分析</div></div>';
    document.getElementById('cArea').innerHTML='<div class="empty"><div class="ico">📈</div><div class="t1">暂无波形</div></div>';
    document.getElementById('dTb').innerHTML='';document.getElementById('pView').innerHTML='<div class="empty"><div class="ico">📖</div><div class="t1">暂无协议</div></div>';
    document.getElementById('stInfo').textContent='就绪';
}
function doExport(){if(!S.parsed)return;var csv='时间,ID,DLC,数据\n';S.frames.forEach(function(f){csv+=f.t.toFixed(6)+',0x'+f.id.toString(16).toUpperCase()+','+f.dl+','+f.d.map(function(b){return('0'+b.toString(16)).slice(-2);}).join(' ')+'\n';});var a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv'}));a.download='can_'+new Date().toISOString().slice(0,10)+'.csv';a.click();}
function mShow(t,b){document.getElementById('mT').textContent=t;document.getElementById('mB').textContent=b;document.getElementById('mBg').classList.add('show');}
function mClose(){document.getElementById('mBg').classList.remove('show');}
window.addEventListener('resize',function(){if(S.sel&&S.msgs[S.sel])renderCharts(S.msgs[S.sel]);});
</script>
