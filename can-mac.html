<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#1C1C1E;--bg2:#2C2C2E;--bg3:#3A3A3C;--text:#E5E5EA;--text2:#AEAEB2;--text3:#8E8E93;--border:#38383A;--blue:#0A84FF;--green:#30D158;--red:#FF453A;--orange:#FF9F0A;--purple:#BF5AF2;--teal:#64D2FF;--row-h:22px}

body{display:flex;flex-direction:column}
button{font-family:inherit;cursor:pointer}input,select{font-family:inherit}

.hdr{height:36px;background:var(--bg2);border-bottom:1px solid var(--border);display:flex;align-items:center;padding:0 10px;flex-shrink:0}

.tb:disabled{opacity:.35;pointer-events:none}
.tb-sep{width:1px;height:18px;background:var(--border);margin:0 2px}
.tb-info{margin-left:auto;font-size:10px;color:var(--text3);display:flex;gap:8px}.tb-info b{color:var(--text)}
.main{flex:1;display:flex;overflow:hidden}

.ch-btn.on{background:var(--blue);border-color:var(--blue);color:#fff}
.left-tabs{display:flex;border-bottom:1px solid var(--border);background:var(--bg2)}

.left-tab.on{color:var(--blue);border-bottom-color:var(--blue)}
.left-list{flex:1;overflow-y:auto}
.sort-bar{padding:3px 4px;border-bottom:1px solid var(--border);display:flex;gap:3px;align-items:center;font-size:9px}

.sort-btn{padding:1px 5px;border-radius:2px;border:1px solid var(--border);background:var(--bg3);color:var(--text3);font-size:8px;cursor:pointer}

.sig-chart-cv{height:80px;position:relative}

/* 光标信息栏 */
.cursor-bar{position:sticky;bottom:0;left:0;right:0;background:rgba(28,28,30,.97);border-top:1px solid var(--border);padding:4px 8px;font-size:9px;font-family:'SF Mono',Menlo,Consolas,monospace;z-index:11;flex-shrink:0;display:flex;flex-wrap:wrap;gap:6px;align-items:center;max-height:60px;overflow-y:auto}
.cursor-bar .ct{color:#FFD60A}.cursor-bar .ct2{color:#FF375F}.cursor-bar .cd{color:var(--green);font-weight:600}
.cursor-bar .cv-row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.cursor-bar .cv-sig{display:flex;gap:3px;align-items:center}
.cursor-bar .cv-dot{width:5px;height:5px;border-radius:50%}
.cursor-bar .cv-val{font-size:9px}
.trace-wrap{flex:1;overflow:auto}
.trace-tbl{width:100%;border-collapse:collapse;font-size:10px}
.trace-tbl th{background:var(--bg3);padding:3px 8px;text-align:left;color:var(--text3);font-size:8px;text-transform:uppercase;border-bottom:1px solid var(--border);position:sticky;top:0;z-index:1}
.trace-tbl td{padding:2px 8px;border-bottom:1px solid rgba(255,255,255,.02);font-family:'SF Mono',Menlo,Consolas,monospace;font-size:9px;height:var(--row-h);white-space:nowrap}
.trace-tbl tr:hover td{background:rgba(255,255,255,.03)}
.pw{flex:1;overflow-y:auto;padding:6px}
.pc{border:1px solid var(--border);border-radius:3px;margin-bottom:4px;background:var(--bg2);overflow:hidden}
.pc-h{display:flex;align-items:center;padding:5px 8px;background:var(--bg3);border-bottom:1px solid var(--border);gap:6px;font-size:11px}
.pc-h .pid{color:var(--blue);font-weight:700;font-family:'SF Mono',Menlo,Consolas,monospace}.pc-h .pname{flex:1}.pc-h .pm{font-size:9px;color:var(--text3)}
table.pt{width:100%;border-collapse:collapse;font-size:9px}
table.pt th{padding:3px 6px;text-align:left;color:var(--text3);font-size:7px;text-transform:uppercase;border-bottom:1px solid var(--border);background:var(--bg3)}
table.pt td{padding:2px 6px;border-bottom:1px solid rgba(255,255,255,.02)}
.sbar{height:22px;background:var(--bg2);border-top:1px solid var(--border);display:flex;align-items:center;padding:0 8px;font-size:9px;color:var(--text3);flex-shrink:0;gap:10px}
.sbar .r{margin-left:auto;display:flex;gap:8px}.sbar .v{color:var(--blue);font-weight:600}
.empty{display:flex;flex-direction:column;align-items:center;justify-content:center;height:100%;color:var(--text3);gap:3px}
.empty .ico{font-size:32px;opacity:.3}.empty .t1{font-size:11px}.empty .t2{font-size:9px;color:var(--text3)}
.dm{position:fixed;inset:0;background:rgba(10,132,255,.12);border:2px dashed var(--blue);z-index:999;display:none;align-items:center;justify-content:center}
.dm.show{display:flex}.dm span{font-size:16px;color:var(--blue);font-weight:600;background:var(--bg);padding:12px 24px;border-radius:6px}
.mb{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:999;display:none;align-items:center;justify-content:center}
.mb.show{display:flex}
.mm{background:var(--bg2);border:1px solid var(--border);border-radius:6px;padding:14px;min-width:280px;max-width:90vw;box-shadow:0 8px 32px rgba(0,0,0,.5)}
.mm h3{font-size:13px;margin-bottom:8px}.mm p{font-size:11px;color:var(--text2);line-height:1.5;margin-bottom:10px}
.mm-btns{display:flex;gap:6px;justify-content:flex-end}
.mm-btns button{padding:5px 14px;border-radius:3px;border:1px solid var(--border);background:var(--bg3);color:var(--text);font-size:10px}
.mm-btns .pri{background:var(--blue);border-color:var(--blue);color:#fff}
</style>

<body>
<div class="hdr"><div class="hdr-logo"><span class="ic">◈</span> CAN Mac Analyzer</div><div class="hdr-right"><span class="v" id="hV"></span><span id="hD"></span></div></div>
<div class="tbar">
  <button class="tb" onclick="document.getElementById('fI').click()">📂 打开</button><input type="file" id="fI" accept=".asc,.blf,.dbc,.txt,.csv" multiple style="display:none">

    <div class="vbody">

          <button class="tb on" id="bCurOff" onclick="setCursorMode('off')">光标关</button>
          <button class="tb" id="bCur1" onclick="setCursorMode('single')">单标尺</button>

<script>
/* ⚠️ 任何代码改动都必须同步更新文件顶部的 VERSION 和 BUILD_DATE */
(function(){document.getElementById('hV').textContent=APP_VERSION;document.getElementById('hD').textContent=BUILD_DATE;document.getElementById('stV').textContent='CAN Mac '+APP_VERSION;document.getElementById('stD').textContent=BUILD_DATE;})();

var S={asc:[],dbc:[],msgs:{},defs:{},frames:[],sel:null,parsed:false,channels:{}};
var C=['#0A84FF','#FF453A','#30D158','#FF9F0A','#BF5AF2','#64D2FF','#FF375F','#FFD60A','#5856D6','#34C759','#FF6482','#AC8E68','#E5E5EA'];
// axisGroups: [{id:1, color:'#0A84FF', skeys:['id::sig',...]}]
var WAVE={selectedSigs:[],cursorMode:'off',cursor1:null,cursor2:null,xRange:null,yRanges:{},mergeMode:true,hiddenLegs:{},sortMode:'id',axisGroups:[]};
var ZOOM={dragging:false,dragStartX:0,dragStartT0:0,dragStartT1:0,canvasParams:null};
var CURSOR_DRAG={active:false,which:null,startX:0};

// === DBC ===
function parseDBC(t){var d={},lines=t.split('\n'),cur=null,vt={};for(var i=0;i<lines.length;i++){var l=lines[i].trim();if(!l||l[0]==='/')continue;var bm=l.match(/^BO_\s+(\d+)\s+(\w+)\s*:\s*(\d+)\s+(\w+)/);if(bm){var id=parseInt(bm[1]);if(id>=0x80000000)id-=0x80000000;cur={id:id,name:bm[2],dlc:parseInt(bm[3]),sender:bm[4],sigs:[],cm:''};d[id]=cur;continue;}var sm=l.match(/^SG_\s+(\w+)\s*:\s*(\d+)\|(\d+)@([01])([+-])\s*\(([^,]+),([^)]+)\)\s*\[([^|]+)\|([^\]]+)\]\s*"([^"]*)"\s*(.*)/);if(sm&&cur){cur.sigs.push({n:sm[1],sb:parseInt(sm[2]),bl:parseInt(sm[3]),bo:parseInt(sm[4]),sg:sm[5],fc:parseFloat(sm[6]),of:parseFloat(sm[7]),mn:parseFloat(sm[8]),mx:parseFloat(sm[9]),u:sm[10],rx:sm[11].trim()});continue;}var vm=l.match(/^VAL_\s+(\d+)\s+(\w+)\s+(.*?)\s*;/);if(vm){var mi=parseInt(vm[1]);if(mi>=0x80000000)mi-=0x80000000;var vp=vm[3].match(/(-?\d+)\s+"([^"]+)"/g);if(vp){var o={};for(var j=0;j<vp.length;j++){var pm=vp[j].match(/(-?\d+)\s+"([^"]+)"/);if(pm)o[parseInt(pm[1])]=pm[2];}if(!vt[mi])vt[mi]={};vt[mi][vm[2]]=o;}continue;}}for(var k in vt)if(d[k])d[k].vt=vt[k];return d;}

// === ASC ===
function parseASC(c){var ls=c.split(/\r?\n/),msgs=[],sk=0,bt=0,hb=false;for(var i=0;i<ls.length;i++){var l=ls[i].trim();if(l.length<10){sk++;continue}var c0=l.charCodeAt(0);if(c0<45||c0>57){sk++;continue}var p=l.split(/\s+/);if(p.length<7){sk++;continue}var ts=parseFloat(p[0]);if(isNaN(ts)){sk++;continue}var ch=parseInt(p[1],10);if(isNaN(ch))ch=1;var idStr=p[2];if(idStr.slice(-1)==='x'||idStr.slice(-1)==='X')idStr=idStr.slice(0,-1);var id=parseInt(idStr,16);if(isNaN(id)){sk++;continue}var di=-1;for(var j=3;j<p.length;j++){if(p[j]==='d'||p[j]==='D'){di=j;break}}if(di<0||di+1>=p.length){sk++;continue}var dlc=parseInt(p[di+1],10);if(isNaN(dlc)||dlc<0||dlc>64){sk++;continue}var data=[];for(var k=di+2;k<p.length&&data.length<dlc;k++){var v=parseInt(p[k],16);if(!isNaN(v))data.push(v);}while(data.length<dlc)data.push(0);if(!hb){bt=ts;hb=true;}msgs.push({t:ts-bt,ch:ch,id:id,dl:dlc,d:data});}msgs.sort(function(a,b){return a.t-b.t});return msgs;}

// === BLF ===
function parseBLF(buf){var u8=new Uint8Array(buf),len=buf.byteLength,dv=new DataView(buf);if(len<144)return[];if(String.fromCharCode(u8[0],u8[1],u8[2],u8[3])!=='LOGG')return[];var pos=144,msgs=[];while(pos+16<=len){if(String.fromCharCode(u8[pos],u8[pos+1],u8[pos+2],u8[pos+3])!=='LOBJ'){pos++;continue}var hdrSize=dv.getUint16(pos+4,true),objSize=dv.getUint32(pos+8,true),objType=dv.getUint32(pos+12,true);if(objSize<16||objSize>100000000){pos++;continue}if(objType===10){var raw=null;if(pos+32<=len){var method=dv.getUint16(pos+16,true);var cd=buf.slice(pos+32,pos+objSize);if(method===0)raw=new Uint8Array(cd);else if((method===2||method===1)&&typeof pako!=='undefined'){try{raw=pako.inflate(new Uint8Array(cd))}catch(e){try{raw=pako.inflate(new Uint8Array(buf.slice(pos+16,pos+objSize)))}catch(e2){raw=null}}}}if(!raw||raw.length===0){var ad=new Uint8Array(buf.slice(pos+16,pos+objSize));if(ad.length>16)raw=ad;}if(raw&&raw.length>16){var inner=blfC(raw);if(inner.length>0)msgs=msgs.concat(inner);}}else{blfO(dv,u8,msgs,objType,pos+hdrSize,len);}pos+=objSize+(objSize%4);}return msgs;}
function blfC(raw){var msgs=[],pos=0,dv=new DataView(raw.buffer,raw.byteOffset,raw.byteLength);while(pos+16<=raw.length){if(String.fromCharCode(raw[pos],raw[pos+1],raw[pos+2],raw[pos+3])!=='LOBJ'){pos++;continue}var hdrSize=dv.getUint16(pos+4,true),objSize=dv.getUint32(pos+8,true),objType=dv.getUint32(pos+12,true);if(objSize<16||pos+objSize>raw.length){pos++;continue}blfO(dv,raw,msgs,objType,pos+hdrSize,raw.length);pos+=objSize+(objSize%4);}return msgs;}
function blfO(dv,u8,msgs,objType,dp,len){if(objType===1&&dp+24<=len){var ts=dv.getFloat64(dp,true),ch=u8[dp+8]|0,dlc=u8[dp+10]|0,id=dv.getUint32(dp+12,true);if(id>=0x80000000)id-=0x80000000;var d=[];for(var j=0;j<dlc&&j<8;j++)d.push(u8[dp+16+j]|0);msgs.push({t:ts/1e9,id:id,ch:ch,dl:dlc,d:d});}}

function decSig(data,sig){var raw=extBits(data,sig.sb,sig.bl,sig.bo);if(sig.sg==='-'&&raw>=(1<<(sig.bl-1)))raw-=(1<<sig.bl);return raw*sig.fc+sig.of;}
function extBits(data,start,len,bo){var val=0;if(bo===1){for(var i=0;i<len;i++){var bp=start+i,bi=bp>>3,bb=bp&7;if(bi<data.length)val|=((data[bi]>>bb)&1)<<i;}}else{for(var i=0;i<len;i++){var bp=start-i;if(bp<0)bp+=8*((-bp>>3)+1);var bi=bp>>3,bb=bp&7;if(bi<data.length)val=(val<<1)|((data[bi]>>bb)&1);}}return val;}

function addAxisGroup(){
    if(!WAVE.selectedSigs.length){mShow('提示','请先勾选信号');return;}
    var gId=WAVE.axisGroups.length+1;
    WAVE.axisGroups.push({id:gId,color:C[(gId-1)%C.length],skeys:[]});

function removeAxisGroup(gId){WAVE.axisGroups=WAVE.axisGroups.filter(function(g){return g.id!==gId;});renderWaveforms();}
function addToAxisGroup(gId){
    // 弹出选择信号的提示
    var available=WAVE.selectedSigs.filter(function(sk){return!WAVE.axisGroups.some(function(g){return g.skeys.indexOf(sk)>=0;});});
    if(!available.length){mShow('提示','没有可用信号');return;}
    // 简单实现：添加第一个未分配的信号
    var g=null;for(var i=0;i<WAVE.axisGroups.length;i++){if(WAVE.axisGroups[i].id===gId){g=WAVE.axisGroups[i];break;}}
    if(g){available.forEach(function(sk){if(g.skeys.indexOf(sk)<0)g.skeys.push(sk);});}
    renderWaveforms();

function toggleAxisGroupSig(gId,sk){
    var g=null;for(var i=0;i<WAVE.axisGroups.length;i++){if(WAVE.axisGroups[i].id===gId){g=WAVE.axisGroups[i];break;}}

function renderMerged(area){
    var html='';

function drawMerged(canvas,skeys){
    var r=canvas.parentElement.getBoundingClientRect(),dpr=window.devicePixelRatio||1;
    canvas.width=r.width*dpr;canvas.height=r.height*dpr;canvas.style.width=r.width+'px';canvas.style.height=r.height+'px';
    var ctx=canvas.getContext('2d');ctx.scale(dpr,dpr);var W=r.width,H=r.height;
    var pl=52,pr=8,pt=8,pb=20,pW=W-pl-pr,pH=H-pt-pb;
    var allPts=[],globalMn=Infinity,globalMx=-Infinity,sigArr=[];
    skeys.forEach(function(sk){if(WAVE.hiddenLegs[sk])return;var d=getSigData(sk);if(!d)return;var pts=[],mn=Infinity,mx=-Infinity;d.frames.forEach(function(f){var v=decSig(f.d,d.sig);pts.push({t:f.t,v:v});if(v<mn)mn=v;if(v>mx)mx=v;});if(pts.length){allPts=allPts.concat(pts);if(mn<globalMn)globalMn=mn;if(mx>globalMx)globalMx=mx;}sigArr.push({sk:sk,pts:pts,col:d.col,name:d.sig.n});});
    if(!allPts.length){ctx.fillStyle='#171717';ctx.fillRect(0,0,W,H);return;}
    var yMn=globalMn,yMx=globalMx;if(yMn===yMx){yMn-=1;yMx+=1;}
    // FitY: 使用可见X范围内的数据
    var t0=allPts[0].t,t1=allPts[allPts.length-1].t;
    if(WAVE.xRange){t0=WAVE.xRange[0];t1=WAVE.xRange[1];}
    if(WAVE.yRanges.__fitVisible){
        yMn=Infinity;yMx=-Infinity;
        sigArr.forEach(function(sd){sd.pts.forEach(function(p){if(p.t>=t0&&p.t<=t1){if(p.v<yMn)yMn=p.v;if(p.v>yMx)yMx=p.v;}});});
        if(yMn===yMx){yMn-=1;yMx+=1;}
    }
    var yRng=yMx-yMn;yMn-=yRng*.08;yMx+=yRng*.08;yRng=yMx-yMn;
    var tR=t1-t0||1;
    canvas._params={pl:pl,pr:pr,pt:pt,pb:pb,pW:pW,pH:pH,t0:t0,t1:t1,tR:tR,mn:yMn,mx:yMx,yRng:yRng};
    ctx.fillStyle='#171717';ctx.fillRect(0,0,W,H);
    ctx.strokeStyle='rgba(255,255,255,.04)';ctx.lineWidth=1;
    for(var i=0;i<=4;i++){var y=pt+(pH/4)*i;ctx.beginPath();ctx.moveTo(pl,y);ctx.lineTo(W-pr,y);ctx.stroke();}
    ctx.fillStyle='#636366';ctx.font='8px -apple-system,sans-serif';ctx.textAlign='right';
    for(var i=0;i<=4;i++)ctx.fillText((yMx-(yRng/4)*i).toFixed(1),pl-4,pt+(pH/4)*i+3);
    ctx.textAlign='center';for(var i=0;i<=5;i++)ctx.fillText((t0+(tR/5)*i).toFixed(2)+'s',pl+(pW/5)*i,H-4);
    sigArr.forEach(function(sd){ctx.strokeStyle=sd.col;ctx.lineWidth=1.5;ctx.beginPath();var ok=false;sd.pts.forEach(function(p){if(p.t<t0||p.t>t1)return;var x=pl+((p.t-t0)/tR)*pW,y=pt+((yMx-p.v)/yRng)*pH;if(!ok){ctx.moveTo(x,y);ok=true;}else ctx.lineTo(x,y);});ctx.stroke();});
    drawCursors(ctx,pl,pt,pW,pH,t0,tR,yMx,yRng);
    canvas._allPts=allPts;canvas._skeys=skeys;
}

// === 独立模式 ===
function renderSeparate(area){var html='';WAVE.selectedSigs.forEach(function(sk,i){var d=getSigData(sk);if(!d)return;var last=d.frames.length?decSig(d.frames[d.frames.length-1].d,d.sig).toFixed(3):'--';html+='<div class="sig-chart"><div class="sig-chart-hdr"><span class="sn" style="color:'+d.col+'">● '+d.sig.n+'</span><span class="su">[0x'+d.msg.id.toString(16).toUpperCase()+']</span><span class="sv">'+last+' '+d.sig.u+'</span><button class="sdel" onclick="toggleSig(\''+sk+'\')">✕</button></div><div class="sig-chart-cv"><canvas id="wv_'+i+'"></canvas></div></div>';});area.innerHTML=html;WAVE.selectedSigs.forEach(function(sk,i){var d=getSigData(sk);if(!d)return;var cv=document.getElementById('wv_'+i);if(cv)drawSingle(cv,d.frames,d.sig,d.col,sk);});}

function drawSingle(canvas,frames,sig,color,sk){var r=canvas.parentElement.getBoundingClientRect(),dpr=window.devicePixelRatio||1;canvas.width=r.width*dpr;canvas.height=r.height*dpr;canvas.style.width=r.width+'px';canvas.style.height=r.height+'px';var ctx=canvas.getContext('2d');ctx.scale(dpr,dpr);var W=r.width,H=r.height;var pts=[],mn=Infinity,mx=-Infinity;frames.forEach(function(f){var v=decSig(f.d,sig);pts.push({t:f.t,v:v});if(v<mn)mn=v;if(v>mx)mx=v;});if(!pts.length)return;if(WAVE.yRanges[sk]){mn=WAVE.yRanges[sk][0];mx=WAVE.yRanges[sk][1];}else{if(mn===mx){mn-=1;mx+=1;}var rng=mx-mn;mn-=rng*.08;mx+=rng*.08;}var yRng=mx-mn;var t0=frames[0].t,t1=frames[frames.length-1].t;if(WAVE.xRange){t0=WAVE.xRange[0];t1=WAVE.xRange[1];}var tR=t1-t0||1;var pl=48,pr=6,pt=4,pb=4,pW=W-pl-pr,pH=H-pt-pb;canvas._params={pl:pl,pr:pr,pt:pt,pb:pb,pW:pW,pH:pH,t0:t0,t1:t1,tR:tR,mn:mn,mx:mx,yRng:yRng};ctx.fillStyle='#171717';ctx.fillRect(0,0,W,H);ctx.strokeStyle='rgba(255,255,255,.04)';ctx.lineWidth=1;for(var i=0;i<=4;i++){var y=pt+(pH/4)*i;ctx.beginPath();ctx.moveTo(pl,y);ctx.lineTo(W-pr,y);ctx.stroke();}ctx.fillStyle='#636366';ctx.font='8px -apple-system,sans-serif';ctx.textAlign='right';for(var i=0;i<=4;i++)ctx.fillText((mx-(yRng/4)*i).toFixed(1),pl-3,pt+(pH/4)*i+3);ctx.textAlign='center';for(var i=0;i<=4;i++)ctx.fillText((t0+(tR/4)*i).toFixed(2)+'s',pl+(pW/4)*i,H-1);ctx.strokeStyle=color;ctx.lineWidth=1.5;ctx.beginPath();var ok=false;pts.forEach(function(p){if(p.t<t0||p.t>t1)return;var x=pl+((p.t-t0)/tR)*pW,y=pt+((mx-p.v)/yRng)*pH;if(!ok){ctx.moveTo(x,y);ok=true;}else ctx.lineTo(x,y);});ctx.stroke();drawCursors(ctx,pl,pt,pW,pH,t0,tR,mx,yRng);canvas._allPts=pts;canvas._skeys=[sk];}

function drawCursors(ctx,pl,pt,pW,pH,t0,tR,yMx,yRng){if(WAVE.cursorMode==='off')return;if(WAVE.cursor1!==null){var cx=pl+((WAVE.cursor1-t0)/tR)*pW;if(cx>=pl&&cx<=pl+pW){ctx.strokeStyle='#FFD60A';ctx.lineWidth=1.5;ctx.setLineDash([4,3]);ctx.beginPath();ctx.moveTo(cx,pt);ctx.lineTo(cx,pt+pH);ctx.stroke();ctx.setLineDash([]);}}if(WAVE.cursorMode==='dual'&&WAVE.cursor2!==null){var cx2=pl+((WAVE.cursor2-t0)/tR)*pW;if(cx2>=pl&&cx2<=pl+pW){ctx.strokeStyle='#FF375F';ctx.lineWidth=1.5;ctx.setLineDash([4,3]);ctx.beginPath();ctx.moveTo(cx2,pt);ctx.lineTo(cx2,pt+pH);ctx.stroke();ctx.setLineDash([]);}}}

// === 光标模式 ===
function setCursorMode(mode){WAVE.cursorMode=mode;document.getElementById('bCurOff').classList.toggle('on',mode==='off');document.getElementById('bCur1').classList.toggle('on',mode==='single');document.getElementById('bCur2').classList.toggle('on',mode==='dual');if(mode==='off'){WAVE.cursor1=null;WAVE.cursor2=null;}renderWaveforms();}
function clearCursors(){WAVE.cursor1=null;WAVE.cursor2=null;renderWaveforms();}

// === 光标信息(显示信号值而非频率) ===
function updateCursorInfo(){
    var bar=document.getElementById('cursorBar');
    if(WAVE.cursorMode==='off'||WAVE.cursor1===null){bar.style.display='none';return;}
    bar.style.display='flex';
    var html='<span class="ct">t1: '+WAVE.cursor1.toFixed(4)+'s</span>';
    // 显示每个选中信号在t1处的值
    html+='<span class="cv-row">';
    WAVE.selectedSigs.forEach(function(sk){if(WAVE.hiddenLegs[sk])return;var d=getSigData(sk);if(!d)return;var val=getValAtTime(d.frames,d.sig,WAVE.cursor1);if(val!==null)html+='<span class="cv-sig"><span class="cv-dot" style="background:'+d.col+'"></span><span class="cv-val" style="color:'+d.col+'">'+d.sig.n+': '+val.toFixed(2)+(d.sig.u?' '+d.sig.u:'')+'</span></span>';});
    html+='</span>';
    if(WAVE.cursorMode==='dual'&&WAVE.cursor2!==null){
        html+='<span class="ct2">t2: '+WAVE.cursor2.toFixed(4)+'s</span>';
        html+='<span class="cd">Δt: '+Math.abs(WAVE.cursor2-WAVE.cursor1).toFixed(4)+'s</span>';
        // t2处的信号值
        html+='<span class="cv-row">';
        WAVE.selectedSigs.forEach(function(sk){if(WAVE.hiddenLegs[sk])return;var d=getSigData(sk);if(!d)return;var val=getValAtTime(d.frames,d.sig,WAVE.cursor2);if(val!==null)html+='<span class="cv-sig"><span class="cv-dot" style="background:'+d.col+'"></span><span class="cv-val" style="color:'+d.col+'">'+d.sig.n+': '+val.toFixed(2)+(d.sig.u?' '+d.sig.u:'')+'</span></span>';});
        html+='</span>';
    }
    bar.innerHTML=html;
}
function getValAtTime(frames,sig,t){
    // 找到t时刻最近的帧
    var best=null,bestDist=Infinity;
    for(var i=0;i<frames.length;i++){var dist=Math.abs(frames[i].t-t);if(dist<bestDist){bestDist=dist;best=frames[i];}else if(dist>bestDist)break;}
    return best?decSig(best.d,sig):null;
}
function toggleLeg(sk){WAVE.hiddenLegs[sk]=!WAVE.hiddenLegs[sk];renderWaveforms();}

// === 缩放/拖动 ===
function getCanvasUnder(e){var cv=e.target.closest('canvas');return(cv&&cv._params)?cv:null;}
document.addEventListener('mousedown',function(e){
    // 检查是否在光标附近(拖动标尺)
    if(WAVE.cursorMode!=='off'){
        var cv=getCanvasUnder(e);if(cv){
            var p=cv._params,rect=cv.getBoundingClientRect(),x=e.clientX-rect.left;
            var cx1=WAVE.cursor1!==null?p.pl+((WAVE.cursor1-p.t0)/p.tR)*p.pW:-100;
            var cx2=WAVE.cursor2!==null?p.pl+((WAVE.cursor2-p.t0)/p.tR)*p.pW:-100;
            if(Math.abs(x-cx1)<8){CURSOR_DRAG.active=true;CURSOR_DRAG.which=1;e.preventDefault();return;}
            if(Math.abs(x-cx2)<8){CURSOR_DRAG.active=true;CURSOR_DRAG.which=2;e.preventDefault();return;}
        }
    }
    if(WAVE.cursorMode!=='off')return;
    var cv=getCanvasUnder(e);if(!cv)return;var p=cv._params,rect=cv.getBoundingClientRect(),x=e.clientX-rect.left;if(x<p.pl||x>p.pl+p.pW)return;ZOOM.dragging=true;ZOOM.dragStartX=e.clientX;ZOOM.dragStartT0=p.t0;ZOOM.dragStartT1=p.t1;ZOOM.canvasParams=p;cv.style.cursor='grabbing';
});
document.addEventListener('mousemove',function(e){
    // 拖动标尺
    if(CURSOR_DRAG.active){
        var cv=getCanvasUnder(e);if(!cv)return;
        var p=cv._params,rect=cv.getBoundingClientRect(),x=e.clientX-rect.left;
        var t=Math.max(p.t0,Math.min(p.t1,p.t0+((x-p.pl)/p.pW)*p.tR));
        if(CURSOR_DRAG.which===1)WAVE.cursor1=t;else WAVE.cursor2=t;
        renderWaveforms();return;
    }
    if(!ZOOM.dragging)return;var dx=e.clientX-ZOOM.dragStartX;var p=ZOOM.canvasParams;var tShift=(-dx/p.pW)*(ZOOM.dragStartT1-ZOOM.dragStartT0);WAVE.xRange=[ZOOM.dragStartT0+tShift,ZOOM.dragStartT1+tShift];renderWaveforms();
});
document.addEventListener('mouseup',function(){
    if(CURSOR_DRAG.active){CURSOR_DRAG.active=false;return;}
    if(ZOOM.dragging){ZOOM.dragging=false;document.querySelectorAll('canvas').forEach(function(cv){cv.style.cursor='crosshair';});}
});
document.addEventListener('wheel',function(e){var cv=getCanvasUnder(e);if(!cv)return;var p=cv._params,rect=cv.getBoundingClientRect(),x=e.clientX-rect.left;if(x<p.pl||x>p.pl+p.pW)return;e.preventDefault();var factor=e.deltaY>0?1.15:0.87;var mouseT=p.t0+((x-p.pl)/p.pW)*p.tR;var newT0=mouseT-(mouseT-(WAVE.xRange?WAVE.xRange[0]:p.t0))*factor;var newT1=mouseT+((WAVE.xRange?WAVE.xRange[1]:p.t1)-mouseT)*factor;WAVE.xRange=[newT0,newT1];renderWaveforms();},{passive:false});

// === 点击放光标(非拖动时) ===
document.addEventListener('click',function(e){
    if(WAVE.cursorMode==='off'||ZOOM.dragging||CURSOR_DRAG.active)return;
    var cv=getCanvasUnder(e);if(!cv)return;var p=cv._params,rect=cv.getBoundingClientRect(),x=e.clientX-rect.left;if(x<p.pl||x>p.pl+p.pW)return;
    var t=p.t0+((x-p.pl)/p.pW)*p.tR;
    if(WAVE.cursorMode==='single'){WAVE.cursor1=t;}
    else if(WAVE.cursorMode==='dual'){if(WAVE.cursor1===null)WAVE.cursor1=t;else if(WAVE.cursor2===null)WAVE.cursor2=t;else{WAVE.cursor1=t;WAVE.cursor2=null;}}
    renderWaveforms();
});

// === Fit ===
function fitAll(){WAVE.xRange=null;WAVE.yRanges={};renderWaveforms();}
function fitY(){WAVE.yRanges={};WAVE.yRanges.__fitVisible=true;renderWaveforms();setTimeout(function(){delete WAVE.yRanges.__fitVisible;},100);}
function resetX(){WAVE.xRange=null;renderWaveforms();}
function resetY(){WAVE.yRanges={};renderWaveforms();}

// === Trace ===
function renderTrace(){var tb=document.getElementById('tTb'),h='',activeCh=getActiveCh(),allFrames=[];for(var mid in S.msgs){var m=S.msgs[mid];m.frames.forEach(function(f,idx){if(activeCh.indexOf(f.ch)<0)return;var hex=f.d.map(function(b){return('0'+b.toString(16).toUpperCase()).slice(-2);}).join(' ');var sv='';if(m.sigs.length){m.sigs.forEach(function(sig,si){var v=decSig(f.d,sig),d=v.toFixed(2);if(m.vt&&m.vt[sig.n]&&m.vt[sig.n][Math.round(v)])d=m.vt[sig.n][Math.round(v)];sv+=(si>0?', ':'')+sig.n+'='+d;});}var per='';if(idx>0)per=((f.t-m.frames[idx-1].t)*1000).toFixed(1)+'ms';allFrames.push({t:f.t,ch:f.ch,id:f.id,dl:f.dl,hex:hex,per:per,sv:sv});});}allFrames.sort(function(a,b){return a.t-b.t;});var disp=allFrames.slice(-500);disp.forEach(function(f,i){h+='<tr><td>'+(allFrames.length-500+i+1)+'</td><td style="color:#5856D6">'+f.t.toFixed(6)+'</td><td>'+f.ch+'</td><td style="color:var(--blue);font-weight:600">0x'+f.id.toString(16).toUpperCase()+'</td><td>'+f.dl+'</td><td style="color:var(--orange)">'+f.hex+'</td><td>'+f.per+'</td><td style="color:var(--green)">'+f.sv+'</td></tr>';});tb.innerHTML=h;}

function renderProto(){var v=document.getElementById('pV'),h='';Object.values(S.defs).sort(function(a,b){return a.id-b.id;}).forEach(function(m){var hx=m.id.toString(16).toUpperCase();h+='<div class="pc"><div class="pc-h"><span class="pid">0x'+hx+'</span><span class="pname">'+m.name+'</span><span class="pm">DLC:'+m.dl+(m.sender?' '+m.sender:'')+'</span></div>';if(m.sigs.length){h+='<table class="pt"><thead><tr><th>信号</th><th>起始</th><th>长度</th><th>字节序</th><th>因子</th><th>偏移</th><th>范围</th><th>单位</th></tr></thead><tbody>';m.sigs.forEach(function(s){h+='<tr><td>'+s.n+'</td><td>'+s.sb+'</td><td>'+s.bl+'</td><td>'+(s.bo===1?'Intel':'Moto')+'</td><td>'+s.fc+'</td><td>'+s.of+'</td><td>['+s.mn+'|'+s.mx+']</td><td>'+s.u+'</td></tr>';});h+='</tbody></table>';}else h+='<div style="padding:6px;color:#636366;font-size:9px">无信号</div>';h+='</div>';});if(!h)h='<div class="empty"><div class="ico">📖</div><div class="t1">暂无协议</div></div>';v.innerHTML=h;}

function tabView(el,name){document.querySelectorAll('.vtab').forEach(function(t){t.classList.remove('on');});el.classList.add('on');document.querySelectorAll('.vpanel').forEach(function(p){p.classList.remove('on');});document.getElementById('v'+name.charAt(0).toUpperCase()+name.slice(1)).classList.add('on');}

function doClear(){S={asc:[],dbc:[],msgs:{},defs:{},frames:[],sel:null,parsed:false,channels:{}};WAVE={selectedSigs:[],cursorMode:'off',cursor1:null,cursor2:null,xRange:null,yRanges:{},mergeMode:true,hiddenLegs:{},sortMode:'id',axisGroups:[]};['sF','sI','sS'].forEach(function(id){document.getElementById(id).textContent='0';});document.getElementById('sD').textContent='0s';document.getElementById('bGo').disabled=true;document.getElementById('bCsv').disabled=true;document.getElementById('pList').innerHTML='<div class="empty" style="height:200px"><div class="ico">📋</div><div class="t2">打开文件开始</div></div>';document.getElementById('sigCharts').innerHTML='';document.getElementById('chartEmpty').style.display='';document.getElementById('tTb').innerHTML='';document.getElementById('pV').innerHTML='<div class="empty"><div class="ico">📖</div><div class="t1">暂无协议</div></div>';document.getElementById('chBar').innerHTML='<span class="ch-label">CH:</span>';document.getElementById('stI').textContent='就绪';document.getElementById('cursorBar').style.display='none';}
function doExport(){if(!S.parsed)return;var csv='时间,CH,ID,DLC,数据\n';S.frames.forEach(function(f){csv+=f.t.toFixed(6)+','+f.ch+',0x'+f.id.toString(16).toUpperCase()+','+f.dl+','+f.d.map(function(b){return('0'+b.toString(16)).slice(-2);}).join(' ')+'\n';});var a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv'}));a.download='can_'+new Date().toISOString().slice(0,10)+'.csv';a.click();}
function mShow(t,b){document.getElementById('mT').textContent=t;document.getElementById('mB').textContent=b;document.getElementById('mBg').classList.add('show');}
function mClose(){document.getElementById('mBg').classList.remove('show');}
window.addEventListener('resize',function(){if(WAVE.selectedSigs.length)renderWaveforms();});
</script>
