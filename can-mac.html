<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<script>
/* ============================================================
 * CAN Mac Analyzer - 版本配置
 * ⚠️ 每次代码修改都必须更新 VERSION 和 BUILD_DATE
 * ============================================================ */
var APP_VERSION = "v2.0.0";
var BUILD_DATE = "2026-08-17 16:50";
/* ============================================================ */
</script>
<script src="https://cdn.jsdelivr.net/npm/pako@2.1.0/dist/pako.min.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--accent:#007AFF;--bg:#1C1C1E;--bg2:#2C2C2E;--bg3:#3A3A3C;--text:#E5E5EA;--text2:#AEAEB2;--text3:#8E8E93;--border:#38383A;--blue:#0A84FF;--green:#30D158;--red:#FF453A;--orange:#FF9F0A;--purple:#BF5AF2;--teal:#64D2FF;--row-h:22px}
html,body{height:100%;overflow:hidden;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,'SF Pro Text','Helvetica Neue',Arial,sans-serif;font-size:12px;-webkit-font-smoothing:antialiased}
body{display:flex;flex-direction:column}
button{font-family:inherit;cursor:pointer}
input,select{font-family:inherit}
::-webkit-scrollbar{width:6px;height:6px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:#424242;border-radius:3px}

/* 顶部 */
.hdr{height:36px;background:var(--bg2);border-bottom:1px solid var(--border);display:flex;align-items:center;padding:0 10px;flex-shrink:0}
.hdr-logo{font-size:14px;font-weight:700;color:var(--text);display:flex;align-items:center;gap:5px}
.hdr-logo .ic{color:var(--blue)}
.hdr-right{margin-left:auto;font-size:10px;color:var(--text3);display:flex;gap:8px;align-items:center}
.hdr-right .v{color:var(--blue);font-weight:600}

/* 工具栏 */
.tbar{height:32px;background:var(--bg2);border-bottom:1px solid var(--border);display:flex;align-items:center;padding:0 8px;gap:3px;flex-shrink:0}
.tb{height:24px;padding:0 8px;border-radius:3px;border:1px solid var(--border);background:var(--bg3);color:var(--text);font-size:10px;display:flex;align-items:center;gap:3px}
.tb:hover{background:#48484A}
.tb:active{background:#545456}
.tb.on{background:var(--blue);border-color:var(--blue);color:#fff}
.tb:disabled{opacity:.35;pointer-events:none}
.tb-sep{width:1px;height:18px;background:var(--border);margin:0 2px}
.tb-info{margin-left:auto;font-size:10px;color:var(--text3);display:flex;gap:8px}
.tb-info b{color:var(--text)}

/* 主容器 */
.main{flex:1;display:flex;overflow:hidden}

/* 左侧 - 报文列表 */
.left{width:240px;background:#1C1C1E;border-right:1px solid var(--border);display:flex;flex-direction:column;flex-shrink:0}
.left-search{padding:4px;border-bottom:1px solid var(--border)}
.left-search input{width:100%;height:22px;background:var(--bg3);border:1px solid var(--border);border-radius:3px;padding:0 6px;color:var(--text);font-size:10px;outline:none}
.left-search input:focus{border-color:var(--blue)}
.left-search input::placeholder{color:var(--text3)}
.left-tabs{display:flex;border-bottom:1px solid var(--border);background:var(--bg2)}
.left-tab{flex:1;padding:4px 0;text-align:center;font-size:9px;color:var(--text3);cursor:pointer;border-bottom:2px solid transparent}
.left-tab.on{color:var(--blue);border-bottom-color:var(--blue)}
.left-list{flex:1;overflow-y:auto}

/* CAN通道筛选 */
.ch-filter{padding:3px 4px;border-bottom:1px solid var(--border);display:flex;gap:2px;flex-wrap:wrap;align-items:center}
.ch-filter .ch-label{font-size:9px;color:var(--text3);margin-right:2px}
.ch-btn{padding:1px 6px;border-radius:2px;border:1px solid var(--border);background:var(--bg3);color:var(--text3);font-size:9px;cursor:pointer}
.ch-btn.on{background:var(--blue);border-color:var(--blue);color:#fff}

/* 报文行 */
.mr{display:flex;align-items:center;height:var(--row-h);padding:0 6px;cursor:pointer;border-left:2px solid transparent;font-size:10px}
.mr:hover{background:rgba(255,255,255,.04)}
.mr.on{background:rgba(10,132,255,.15);border-left-color:var(--blue)}
.mr-dot{width:5px;height:5px;border-radius:50%;flex-shrink:0;margin-right:5px}
.mr-id{font-family:'SF Mono',Menlo,Consolas,monospace;font-size:10px;color:var(--blue);width:60px;flex-shrink:0;font-weight:600}
.mr-name{flex:1;font-size:10px;color:var(--text2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mr-cnt{font-size:9px;color:var(--text3);flex-shrink:0}
.mr-ch{font-size:8px;padding:0 3px;border-radius:2px;margin-left:3px;flex-shrink:0;font-weight:600}

/* 信号行 */
.sr{display:flex;align-items:center;height:20px;padding:0 6px 0 16px;cursor:pointer;font-size:9px}
.sr:hover{background:rgba(255,255,255,.04)}
.sr-dot{width:4px;height:4px;border-radius:50%;flex-shrink:0;margin-right:4px}
.sr-name{flex:1;color:var(--text2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sr-val{font-family:'SF Mono',Menlo,Consolas,monospace;color:var(--green);flex-shrink:0;margin-left:4px}

/* 右侧 */
.right{flex:1;display:flex;flex-direction:column;overflow:hidden}
.vtabs{display:flex;background:var(--bg2);border-bottom:1px solid var(--border);flex-shrink:0}
.vtab{padding:5px 12px;font-size:10px;color:var(--text3);cursor:pointer;border-bottom:2px solid transparent}
.vtab.on{color:var(--blue);border-bottom-color:var(--blue)}
.vbody{flex:1;overflow:hidden}
.vpanel{display:none;height:100%}
.vpanel.on{display:flex;flex-direction:column}

/* 波形区 */
.cw{flex:1;overflow-y:auto;padding:4px;background:#171717}
.cb{border:1px solid var(--border);border-radius:3px;margin-bottom:4px;background:var(--bg2);overflow:hidden}
.ch{display:flex;align-items:center;height:22px;padding:0 6px;background:var(--bg3);border-bottom:1px solid var(--border);gap:4px}
.ch .sn{font-size:9px;font-weight:600}
.ch .sv{font-size:9px;font-family:'SF Mono',Menlo,Consolas,monospace;color:#fff;margin-left:auto}
.cc{height:90px;position:relative}
.cc canvas{display:block;width:100%;height:100%}

/* 数据表 */
.dw{flex:1;overflow:auto;padding:2px}
table.dt{width:100%;border-collapse:collapse;font-size:10px}
table.dt th{background:var(--bg3);padding:3px 6px;text-align:left;color:var(--text3);font-size:8px;text-transform:uppercase;border-bottom:1px solid var(--border);position:sticky;top:0}
table.dt td{padding:2px 6px;border-bottom:1px solid rgba(255,255,255,.02);font-family:'SF Mono',Menlo,Consolas,monospace;font-size:9px;height:var(--row-h)}
table.dt tr:hover td{background:rgba(255,255,255,.03)}
.c-t{color:#5856D6}.c-i{color:var(--blue);font-weight:600}.c-h{color:var(--orange)}.c-s{color:var(--green)}

/* Trace视图 - CANoe风格 */
.trace-wrap{flex:1;overflow:auto;padding:0}
.trace-tbl{width:100%;border-collapse:collapse;font-size:10px}
.trace-tbl th{background:var(--bg3);padding:3px 8px;text-align:left;color:var(--text3);font-size:8px;text-transform:uppercase;border-bottom:1px solid var(--border);position:sticky;top:0;z-index:1}
.trace-tbl td{padding:2px 8px;border-bottom:1px solid rgba(255,255,255,.02);font-family:'SF Mono',Menlo,Consolas,monospace;font-size:9px;height:var(--row-h);white-space:nowrap}
.trace-tbl tr:hover td{background:rgba(255,255,255,.03)}
.trace-tbl tr.sel td{background:rgba(10,132,255,.12)}

/* 协议视图 */
.pw{flex:1;overflow-y:auto;padding:6px}
.pc{border:1px solid var(--border);border-radius:3px;margin-bottom:4px;background:var(--bg2);overflow:hidden}
.pc-h{display:flex;align-items:center;padding:5px 8px;background:var(--bg3);border-bottom:1px solid var(--border);gap:6px;font-size:11px}
.pc-h .pid{color:var(--blue);font-weight:700;font-family:'SF Mono',Menlo,Consolas,monospace}
.pc-h .pname{flex:1}
.pc-h .pm{font-size:9px;color:var(--text3)}
table.pt{width:100%;border-collapse:collapse;font-size:9px}
table.pt th{padding:3px 6px;text-align:left;color:var(--text3);font-size:7px;text-transform:uppercase;border-bottom:1px solid var(--border);background:var(--bg3)}
table.pt td{padding:2px 6px;border-bottom:1px solid rgba(255,255,255,.02)}

/* 状态栏 */
.sbar{height:22px;background:var(--bg2);border-top:1px solid var(--border);display:flex;align-items:center;padding:0 8px;font-size:9px;color:var(--text3);flex-shrink:0;gap:10px}
.sbar .r{margin-left:auto;display:flex;gap:8px}
.sbar .v{color:var(--blue);font-weight:600}

/* 空状态 */
.empty{display:flex;flex-direction:column;align-items:center;justify-content:center;height:100%;color:var(--text3);gap:3px}
.empty .ico{font-size:32px;opacity:.3}
.empty .t1{font-size:11px}.empty .t2{font-size:9px;color:var(--text3)}

/* 拖拽 */
.dm{position:fixed;inset:0;background:rgba(10,132,255,.12);border:2px dashed var(--blue);z-index:999;display:none;align-items:center;justify-content:center}
.dm.show{display:flex}
.dm span{font-size:16px;color:var(--blue);font-weight:600;background:var(--bg);padding:12px 24px;border-radius:6px}

/* 弹窗 */
.mb{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:999;display:none;align-items:center;justify-content:center}
.mb.show{display:flex}
.mm{background:var(--bg2);border:1px solid var(--border);border-radius:6px;padding:14px;min-width:280px;max-width:90vw;box-shadow:0 8px 32px rgba(0,0,0,.5)}
.mm h3{font-size:13px;margin-bottom:8px}
.mm p{font-size:11px;color:var(--text2);line-height:1.5;margin-bottom:10px}
.mm-btns{display:flex;gap:6px;justify-content:flex-end}
.mm-btns button{padding:5px 14px;border-radius:3px;border:1px solid var(--border);background:var(--bg3);color:var(--text);font-size:10px}
.mm-btns .pri{background:var(--blue);border-color:var(--blue);color:#fff}
</style>
</head>
<body>
<div class="hdr">
  <div class="hdr-logo"><span class="ic">◈</span> CAN Mac Analyzer</div>
  <div class="hdr-right"><span class="v" id="hV"></span><span id="hD"></span></div>
</div>
<div class="tbar">
  <button class="tb" onclick="document.getElementById('fI').click()">📂 打开</button>
  <input type="file" id="fI" accept=".asc,.blf,.dbc,.txt,.csv" multiple style="display:none">
  <div class="tb-sep"></div>
  <button class="tb on" id="bGo" onclick="doParse()" disabled>▶ 解析</button>
  <button class="tb" onclick="doClear()">✕ 清除</button>
  <div class="tb-sep"></div>
  <button class="tb" id="bCsv" onclick="doExport()" disabled>⬇ CSV</button>
  <div class="tb-info"><span>帧 <b id="sF">0</b></span><span>ID <b id="sI">0</b></span><span>信号 <b id="sS">0</b></span><span>时长 <b id="sD">0s</b></span></div>
</div>
<div class="main">
  <div class="left">
    <div class="left-search"><input id="sBox" placeholder="🔍 搜索..." oninput="doFilter()"></div>
    <div class="ch-filter" id="chBar"><span class="ch-label">CH:</span></div>
    <div class="left-tabs"><div class="left-tab on" onclick="tabSide(this,'msg')">报文</div><div class="left-tab" onclick="tabSide(this,'sig')">信号</div></div>
    <div class="left-list" id="pList"><div class="empty" style="height:200px"><div class="ico">📋</div><div class="t2">打开文件开始</div></div></div>
  </div>
  <div class="right">
    <div class="vtabs">
      <div class="vtab on" onclick="tabView(this,'chart')">📈 波形</div>
      <div class="vtab" onclick="tabView(this,'trace')">📋 Trace</div>
      <div class="vtab" onclick="tabView(this,'proto')">📖 协议</div>
    </div>
    <div class="vbody">
      <div class="vpanel on" id="vChart"><div class="cw" id="cA"><div class="empty"><div class="ico">📈</div><div class="t1">暂无波形</div><div class="t2">加载ASC/BLF+DBC后点击解析</div></div></div></div>
      <div class="vpanel" id="vTrace"><div class="trace-wrap"><table class="trace-tbl"><thead><tr><th>#</th><th>时间</th><th>CH</th><th>ID</th><th>DLC</th><th>Data</th><th>周期</th><th>信号</th></tr></thead><tbody id="tTb"></tbody></table></div></div>
      <div class="vpanel" id="vProto"><div class="pw" id="pV"><div class="empty"><div class="ico">📖</div><div class="t1">暂无协议</div><div class="t2">加载DBC文件</div></div></div></div>
    </div>
  </div>
</div>
<div class="sbar"><span id="stI">就绪</span><div class="r"><span class="v" id="stV"></span><span id="stD"></span></div></div>
<div class="dm" id="dM"><span>📁 拖放文件到此处</span></div>
<div class="mb" id="mBg"><div class="mm"><h3 id="mT">提示</h3><p id="mB"></p><div class="mm-btns"><button class="pri" onclick="mClose()">确定</button></div></div></div>

<script>
/* ============================================================
 * CAN Mac Analyzer - 核心逻辑 (参考can-analyzer解析方法)
 * ⚠️ 任何代码改动都必须同步更新文件顶部的 VERSION 和 BUILD_DATE
 * ============================================================ */

// === 版本 ===
(function(){document.getElementById('hV').textContent=APP_VERSION;document.getElementById('hD').textContent=BUILD_DATE;document.getElementById('stV').textContent='CAN Mac '+APP_VERSION;document.getElementById('stD').textContent=BUILD_DATE;})();

// === 状态 ===
var S={asc:[],dbc:[],msgs:{},defs:{},frames:[],sel:null,ci:0,parsed:false,channels:{}};
var C=['#0A84FF','#FF453A','#30D158','#FF9F0A','#BF5AF2','#64D2FF','#FF375F','#FFD60A','#5856D6','#34C759','#FF6482','#AC8E68','#E5E5EA'];

// === DBC解析 (参考can-analyzer) ===
function parseDBC(t){
    var d={},lines=t.split('\n'),cur=null,vt={};
    for(var i=0;i<lines.length;i++){
        var l=lines[i].trim();if(!l||l[0]==='/')continue;
        // BO_ ID Name: DLC Sender
        var bm=l.match(/^BO_\s+(\d+)\s+(\w+)\s*:\s*(\d+)\s+(\w+)/);
        if(bm){var id=parseInt(bm[1]);if(id>=0x80000000)id-=0x80000000;cur={id:id,name:bm[2],dlc:parseInt(bm[3]),sender:bm[4],sigs:[],cm:''};d[id]=cur;continue;}
        // SG_ Name : StartBit|BitLength@ByteOrder Sign (Factor,Offset) [Min|Max] "Unit" Receiver
        var sm=l.match(/^SG_\s+(\w+)\s*:\s*(\d+)\|(\d+)@([01])([+-])\s*\(([^,]+),([^)]+)\)\s*\[([^|]+)\|([^\]]+)\]\s*"([^"]*)"\s*(.*)/);
        if(sm&&cur){cur.sigs.push({n:sm[1],sb:parseInt(sm[2]),bl:parseInt(sm[3]),bo:parseInt(sm[4]),sg:sm[5],fc:parseFloat(sm[6]),of:parseFloat(sm[7]),mn:parseFloat(sm[8]),mx:parseFloat(sm[9]),u:sm[10],rx:sm[11].trim()});continue;}
        // VAL_ MsgID SigName Val "Desc" ... ;
        var vm=l.match(/^VAL_\s+(\d+)\s+(\w+)\s+(.*?)\s*;/);
        if(vm){var mi=parseInt(vm[1]);if(mi>=0x80000000)mi-=0x80000000;var vp=vm[3].match(/(-?\d+)\s+"([^"]+)"/g);if(vp){var o={};for(var j=0;j<vp.length;j++){var pm=vp[j].match(/(-?\d+)\s+"([^"]+)"/);if(pm)o[parseInt(pm[1])]=pm[2];}if(!vt[mi])vt[mi]={};vt[mi][vm[2]]=o;}continue;}
        // CM_ BO_ ID "Comment"
        var cm=l.match(/^CM_\s+BO_\s+(\d+)\s+"([^"]*)"/);
        if(cm){var ci=parseInt(cm[1]);if(ci>=0x80000000)ci-=0x80000000;if(d[ci])d[ci].cm=cm[2];}
        // CM_ SG_ ID SigName "Comment"
        var csg=l.match(/^CM_\s+SG_\s+(\d+)\s+(\w+)\s+"([^"]*)"/);
        if(csg){var csgId=parseInt(csg[1]);if(csgId>=0x80000000)csgId-=0x80000000;if(d[csgId]){for(var si=0;si<d[csgId].sigs.length;si++){if(d[csgId].sigs[si].n===csg[2])d[csgId].sigs[si].cm=csg[3];}}}
    }
    for(var k in vt)if(d[k])d[k].vt=vt[k];return d;
}

// === ASC解析 (参考can-analyzer pASC函数) ===
function parseASC(c){
    var ls=c.split(/\r?\n/),msgs=[],sk=0,bt=0,hb=false;
    for(var i=0;i<ls.length;i++){
        var l=ls[i].trim();
        if(l.length<10){sk++;continue}
        var c0=l.charCodeAt(0);
        // 跳过非数据行(字母开头的行)
        if(c0<45||c0>57){sk++;continue}
        var p=l.split(/\s+/);
        if(p.length<7){sk++;continue}
        var ts=parseFloat(p[0]);if(isNaN(ts)){sk++;continue}
        var ch=parseInt(p[1],10);if(isNaN(ch))ch=1;
        var idStr=p[2];
        // 去掉末尾的x/X
        if(idStr.slice(-1)==='x'||idStr.slice(-1)==='X')idStr=idStr.slice(0,-1);
        var id=parseInt(idStr,16);if(isNaN(id)){sk++;continue}
        // 查找 'd' 或 'D' 分隔符
        var di=-1;
        for(var j=3;j<p.length;j++){if(p[j]==='d'||p[j]==='D'){di=j;break}}
        if(di<0||di+1>=p.length){sk++;continue}
        var dlc=parseInt(p[di+1],10);
        if(isNaN(dlc)||dlc<0||dlc>64){sk++;continue}
        var data=[];
        for(var k=di+2;k<p.length&&data.length<dlc;k++){
            var v=parseInt(p[k],16);if(!isNaN(v))data.push(v);
        }
        while(data.length<dlc)data.push(0);
        if(!hb){bt=ts;hb=true;}
        msgs.push({t:ts-bt,ch:ch,id:id,dl:dlc,d:data});
    }
    msgs.sort(function(a,b){return a.t-b.t});
    return msgs;
}

// === BLF解析 (参考can-analyzer pBLF函数) ===
function parseBLF(buf){
    var u8=new Uint8Array(buf),len=buf.byteLength,dv=new DataView(buf);
    if(len<144)return[];
    var sig=String.fromCharCode(u8[0],u8[1],u8[2],u8[3]);
    if(sig!=='LOGG'){console.warn('BLF签名不匹配:',sig);return[];}
    var pos=144,msgs=[];
    while(pos+16<=len){
        var osig=String.fromCharCode(u8[pos],u8[pos+1],u8[pos+2],u8[pos+3]);
        if(osig!=='LOBJ'){pos++;continue}
        var hdrSize=dv.getUint16(pos+4,true);
        var objSize=dv.getUint32(pos+8,true);
        var objType=dv.getUint32(pos+12,true);
        if(objSize<16||objSize>100000000){pos++;continue}
        var pad=objSize%4;
        if(objType===10){
            // LOG_CONTAINER
            var raw=null;
            if(pos+32<=len){
                var method=dv.getUint16(pos+16,true);
                var containerData=buf.slice(pos+32,pos+objSize);
                if(method===0){raw=new Uint8Array(containerData);}
                else if((method===2||method===1)&&typeof pako!=='undefined'){
                    try{raw=pako.inflate(new Uint8Array(containerData))}catch(e){
                        try{raw=pako.inflate(new Uint8Array(buf.slice(pos+16,pos+objSize)))}catch(e2){raw=null}
                    }
                }
            }
            if(!raw||raw.length===0){
                var allData=new Uint8Array(buf.slice(pos+16,pos+objSize));
                if(allData.length>16)raw=allData;
            }
            if(raw&&raw.length>16){
                var inner=parseBLFContainer(raw);
                if(inner.length>0)msgs=msgs.concat(inner);
            }
        }else{
            // 直接解析对象
            var dp=pos+hdrSize;
            parseBLFObject(dv,u8,msgs,objType,dp,len);
        }
        pos+=objSize+pad;
    }
    return msgs;
}
function parseBLFContainer(raw){
    var msgs=[],pos=0,dv=new DataView(raw.buffer,raw.byteOffset,raw.byteLength);
    while(pos+16<=raw.length){
        var osig=String.fromCharCode(raw[pos],raw[pos+1],raw[pos+2],raw[pos+3]);
        if(osig!=='LOBJ'){pos++;continue}
        var hdrSize=dv.getUint16(pos+4,true);
        var objSize=dv.getUint32(pos+8,true);
        var objType=dv.getUint32(pos+12,true);
        if(objSize<16||pos+objSize>raw.length){pos++;continue}
        var dp=pos+hdrSize;
        parseBLFObject(dv,raw,msgs,objType,dp,raw.length);
        pos+=objSize+(objSize%4);
    }
    return msgs;
}
function parseBLFObject(dv,u8,msgs,objType,dp,len){
    // CAN_MESSAGE=1, CAN_ERROR=2, CAN_OVERLOAD=3, CAN_STATISTIC=4, CAN_FD_MESSAGE=100
    if(objType===1&&dp+24<=len){
        var ts=dv.getFloat64(dp,true);
        var ch=u8[dp+8]|0;
        var dlc=u8[dp+10]|0;
        var id=dv.getUint32(dp+12,true);
        if(id>=0x80000000)id-=0x80000000;
        var data=[];
        for(var j=0;j<dlc&&j<8;j++)data.push(u8[dp+16+j]|0);
        msgs.push({t:ts/1e9,id:id,ch:ch,dl:dlc,d:data});
    }
}

// === 信号解码 ===
function decSig(data,sig){
    var raw=extBits(data,sig.sb,sig.bl,sig.bo);
    if(sig.sg==='-'&&raw>=(1<<(sig.bl-1)))raw-=(1<<sig.bl);
    return raw*sig.fc+sig.of;
}
function extBits(data,start,len,bo){
    var val=0;
    if(bo===1){for(var i=0;i<len;i++){var bp=start+i,bi=bp>>3,bb=bp&7;if(bi<data.length)val|=((data[bi]>>bb)&1)<<i;}}
    else{for(var i=0;i<len;i++){var bp=start-i;if(bp<0)bp+=8*((-bp>>3)+1);var bi=bp>>3,bb=bp&7;if(bi<data.length)val=(val<<1)|((data[bi]>>bb)&1);}}
    return val;
}

// === 文件处理 ===
document.getElementById('fI').addEventListener('change',function(e){procFiles(Array.from(e.target.files));e.target.value='';});
function procFiles(files){
    var pend=files.length;if(!pend)return;
    files.forEach(function(f){
        var ext=f.name.split('.').pop().toLowerCase();
        if(ext==='dbc'){var r=new FileReader();r.onload=function(e){var d=parseDBC(e.target.result);for(var k in d)S.defs[k]=d[k];S.dbc.push(f.name);updSt();if(!--pend)ready();};r.readAsText(f);}
        else if(ext==='asc'||ext==='txt'||ext==='csv'){var r2=new FileReader();r2.onload=function(e){var fr=parseASC(e.target.result);console.log('ASC解析:',fr.length,'帧');S.frames=S.frames.concat(fr);S.asc.push(f.name);updSt();if(!--pend)ready();};r2.readAsText(f);}
        else if(ext==='blf'){var r3=new FileReader();r3.onload=function(e){var fr=parseBLF(e.target.result);console.log('BLF解析:',fr.length,'帧');S.frames=S.frames.concat(fr);S.asc.push(f.name);updSt();if(!--pend)ready();};r3.readAsArrayBuffer(f);}
        else{pend--;if(!pend)ready();}
    });
}
function ready(){document.getElementById('bGo').disabled=!(S.frames.length>0||Object.keys(S.defs).length>0);}
function updSt(){document.getElementById('stI').textContent='ASC:'+S.asc.length+' DBC:'+S.dbc.length+' 帧:'+S.frames.length;}

// === 拖拽 ===
var dc=0;
document.addEventListener('dragenter',function(e){e.preventDefault();dc++;document.getElementById('dM').classList.add('show');});
document.addEventListener('dragleave',function(e){e.preventDefault();dc--;if(dc<=0){document.getElementById('dM').classList.remove('show');dc=0;}});
document.addEventListener('dragover',function(e){e.preventDefault();});
document.addEventListener('drop',function(e){e.preventDefault();document.getElementById('dM').classList.remove('show');dc=0;if(e.dataTransfer.files.length)procFiles(Array.from(e.dataTransfer.files));});

// === 解析 ===
function doParse(){
    if(!S.frames.length&&!Object.keys(S.defs).length){mShow('提示','请先加载文件');return;}
    S.frames.sort(function(a,b){return a.t-b.t;});
    S.msgs={};S.channels={};
    S.frames.forEach(function(f){
        if(!S.msgs[f.id]){var d=S.defs[f.id];S.msgs[f.id]={id:f.id,name:d?d.name:'Unknown',dl:f.dl,sigs:d?d.sigs:[],vt:d?d.vt:null,frames:[],cnt:0};}
        S.msgs[f.id].frames.push(f);S.msgs[f.id].cnt++;
        S.channels[f.ch]=true;
    });
    S.parsed=true;document.getElementById('bCsv').disabled=false;
    var ui=Object.keys(S.msgs).length,sc=0;for(var m in S.msgs)sc+=S.msgs[m].sigs.length;
    var dur=S.frames.length>0?S.frames[S.frames.length-1].t-S.frames[0].t:0;
    document.getElementById('sF').textContent=S.frames.length;document.getElementById('sI').textContent=ui;
    document.getElementById('sS').textContent=sc;document.getElementById('sD').textContent=dur.toFixed(2)+'s';
    renderChFilter();renderSide();renderProto();renderTrace();
    var first=Object.keys(S.msgs)[0];if(first)selMsg(parseInt(first));
    mShow('解析完成','共 '+S.frames.length+' 帧，'+ui+' 个ID，'+sc+' 个信号');
}

// === 通道筛选 ===
function renderChFilter(){
    var bar=document.getElementById('chBar');
    var chs=Object.keys(S.channels).sort(function(a,b){return parseInt(a)-parseInt(b);});
    var html='<span class="ch-label">CH:</span><button class="ch-btn on" onclick="toggleCh(this,0)">ALL</button>';
    chs.forEach(function(ch){html+='<button class="ch-btn on" onclick="toggleCh(this,'+ch+')">'+ch+'</button>';});
    bar.innerHTML=html;
}
function toggleCh(el,ch){
    if(ch===0){var allOn=el.classList.contains('on');document.querySelectorAll('.ch-btn').forEach(function(b){if(allOn)b.classList.remove('on');else b.classList.add('on');});}
    else{el.classList.toggle('on');}
    renderSide();
}

// === 侧边栏 ===
function renderSide(){
    var c=document.getElementById('pList');
    var tb=document.querySelector('.left-tab.on');
    if(tb&&tb.textContent==='信号')renderSig(c);else renderMsg(c);
}
function renderMsg(c){
    var h='',sorted=Object.values(S.msgs).sort(function(a,b){return a.id-b.id;});
    var activeCh=getActiveCh();
    sorted.forEach(function(m){
        // 通道筛选
        var filtered=m.frames.filter(function(f){return activeCh.indexOf(f.ch)>=0;});
        if(filtered.length===0)return;
        var col=C[m.id%C.length],hx=m.id.toString(16).toUpperCase(),on=S.sel===m.id?' on':'';
        var ch=m.frames[0].ch;
        h+='<div class="mr'+on+'" onclick="selMsg('+m.id+')" data-id="'+m.id+'"><div class="mr-dot" style="background:'+col+'"></div><div class="mr-id">0x'+hx+'</div><div class="mr-name">'+m.name+'</div><div class="mr-ch" style="background:'+C[ch%C.length]+'22;color:'+C[ch%C.length]+'">CH'+ch+'</div><div class="mr-cnt">'+filtered.length+'</div></div>';
    });
    c.innerHTML=h||'<div class="empty" style="height:200px"><div class="t2">无匹配报文</div></div>';
}
function renderSig(c){
    var h='';var activeCh=getActiveCh();
    for(var mid in S.msgs){
        var m=S.msgs[mid];
        var filtered=m.frames.filter(function(f){return activeCh.indexOf(f.ch)>=0;});
        if(filtered.length===0)continue;
        m.sigs.forEach(function(sig,idx){
            var col=C[(parseInt(mid)+idx)%C.length];
            var last=filtered.length?decSig(filtered[filtered.length-1].d,sig).toFixed(3):'--';
            h+='<div class="sr" onclick="selMsg('+mid+')"><div class="sr-dot" style="background:'+col+'"></div><div class="sr-name">'+sig.n+'</div><div class="sr-val">'+last+(sig.u?' '+sig.u:'')+'</div></div>';
        });
    }
    c.innerHTML=h||'<div class="empty" style="height:200px"><div class="t2">无信号</div></div>';
}
function getActiveCh(){
    var btns=document.querySelectorAll('.ch-btn');
    var chs=[];btns.forEach(function(b,i){if(b.classList.contains('on')){if(i===0){chs=Object.keys(S.channels).map(Number);return;}else chs.push(parseInt(b.textContent));}});
    return chs.length?chs:Object.keys(S.channels).map(Number);
}
function doFilter(){var q=document.getElementById('sBox').value.toLowerCase();document.querySelectorAll('#pList .mr,#pList .sr').forEach(function(el){el.style.display=el.textContent.toLowerCase().indexOf(q)>=0?'':'none';});}
function tabSide(el){document.querySelectorAll('.left-tab').forEach(function(t){t.classList.remove('on');});el.classList.add('on');renderSide();}

// === 报文选择 ===
function selMsg(id){
    S.sel=id;document.querySelectorAll('.mr').forEach(function(el){el.classList.toggle('on',parseInt(el.dataset.id)===id);});
    var m=S.msgs[id];if(!m)return;
    var activeCh=getActiveCh();
    var filtered={id:m.id,name:m.name,dl:m.dl,sigs:m.sigs,vt:m.vt,frames:m.frames.filter(function(f){return activeCh.indexOf(f.ch)>=0;})};
    renderCharts(filtered);renderTrace();
}

// === 波形 ===
function renderCharts(m){
    var a=document.getElementById('cA');
    if(!m.sigs||!m.sigs.length){a.innerHTML='<div class="empty"><div class="ico">📈</div><div class="t1">无信号定义</div><div class="t2">加载对应DBC文件</div></div>';return;}
    var h='';m.sigs.forEach(function(sig,idx){var col=C[(m.id+idx)%C.length],cid='cv_'+m.id+'_'+idx;var last=m.frames.length?decSig(m.frames[m.frames.length-1].d,sig).toFixed(3):'--';h+='<div class="cb"><div class="ch"><span class="sn" style="color:'+col+'">● '+sig.n+'</span><span class="sv">'+last+' '+sig.u+'</span></div><div class="cc"><canvas id="'+cid+'"></canvas></div></div>';});
    a.innerHTML=h;
    m.sigs.forEach(function(sig,idx){var cv=document.getElementById('cv_'+m.id+'_'+idx);if(cv)drawCv(cv,m,sig,C[(m.id+idx)%C.length]);});
}
function drawCv(canvas,msg,sig,color){
    var r=canvas.parentElement.getBoundingClientRect(),dpr=window.devicePixelRatio||1;
    canvas.width=r.width*dpr;canvas.height=r.height*dpr;canvas.style.width=r.width+'px';canvas.style.height=r.height+'px';
    var ctx=canvas.getContext('2d');ctx.scale(dpr,dpr);var W=r.width,H=r.height;
    var pts=[],mn=Infinity,mx=-Infinity;
    msg.frames.forEach(function(f){var v=decSig(f.d,sig);pts.push({t:f.t,v:v});if(v<mn)mn=v;if(v>mx)mx=v;});
    if(!pts.length)return;if(mn===mx){mn-=1;mx+=1;}var rng=mx-mn;mn-=rng*.1;mx+=rng*.1;rng=mx-mn;
    var pl=42,pr=4,pt=4,pb=14,pW=W-pl-pr,pH=H-pt-pb;
    var t0=pts[0].t,t1=pts[pts.length-1].t,tR=t1-t0||1;
    ctx.fillStyle='#171717';ctx.fillRect(0,0,W,H);
    ctx.strokeStyle='rgba(255,255,255,.04)';ctx.lineWidth=1;
    for(var i=0;i<=4;i++){var y=pt+(pH/4)*i;ctx.beginPath();ctx.moveTo(pl,y);ctx.lineTo(W-pr,y);ctx.stroke();}
    ctx.fillStyle='#636366';ctx.font='8px -apple-system,sans-serif';ctx.textAlign='right';
    for(var i=0;i<=4;i++)ctx.fillText((mx-(rng/4)*i).toFixed(1),pl-3,pt+(pH/4)*i+3);
    ctx.textAlign='center';for(var i=0;i<=4;i++)ctx.fillText((t0+(tR/4)*i).toFixed(2)+'s',pl+(pW/4)*i,H-2);
    ctx.strokeStyle=color;ctx.lineWidth=1.5;ctx.beginPath();var ok=false;
    pts.forEach(function(p){var x=pl+((p.t-t0)/tR)*pW,y=pt+((mx-p.v)/rng)*pH;if(!ok){ctx.moveTo(x,y);ok=true;}else ctx.lineTo(x,y);});
    ctx.stroke();
    ctx.lineTo(pl+pW,pt+pH);ctx.lineTo(pl,pt+pH);ctx.closePath();ctx.fillStyle=color+'14';ctx.fill();
}

// === Trace视图 (CANoe风格) ===
function renderTrace(){
    var tb=document.getElementById('tTb'),h='';
    var activeCh=getActiveCh();
    var allFrames=[];
    for(var mid in S.msgs){
        var m=S.msgs[mid];
        m.frames.forEach(function(f,idx){
            if(activeCh.indexOf(f.ch)<0)return;
            var hex=f.d.map(function(b){return('0'+b.toString(16).toUpperCase()).slice(-2);}).join(' ');
            var sv='';
            if(m.sigs.length){m.sigs.forEach(function(sig,si){var v=decSig(f.d,sig),d=v.toFixed(2);if(m.vt&&m.vt[sig.n]&&m.vt[sig.n][Math.round(v)])d=m.vt[sig.n][Math.round(v)];sv+=(si>0?', ':'')+sig.n+'='+d;});}
            var per='';
            if(idx>0)per=((f.t-m.frames[idx-1].t)*1000).toFixed(1)+'ms';
            allFrames.push({t:f.t,ch:f.ch,id:f.id,dl:f.dl,hex:hex,per:per,sv:sv,mname:m.name,n:m.sigs.length});
        });
    }
    allFrames.sort(function(a,b){return a.t-b.t;});
    // 只显示最后500条
    var disp=allFrames.slice(-500);
    disp.forEach(function(f,i){
        h+='<tr><td>'+(allFrames.length-500+i+1)+'</td><td class="c-t">'+f.t.toFixed(6)+'</td><td>'+f.ch+'</td><td class="c-i">0x'+f.id.toString(16).toUpperCase()+'</td><td>'+f.dl+'</td><td class="c-h">'+f.hex+'</td><td>'+f.per+'</td><td class="c-s">'+f.sv+'</td></tr>';
    });
    tb.innerHTML=h;
}

// === 协议 ===
function renderProto(){
    var v=document.getElementById('pV'),h='';
    Object.values(S.defs).sort(function(a,b){return a.id-b.id;}).forEach(function(m){
        var hx=m.id.toString(16).toUpperCase();
        h+='<div class="pc"><div class="pc-h"><span class="pid">0x'+hx+'</span><span class="pname">'+m.name+'</span><span class="pm">DLC:'+m.dl+(m.sender?' '+m.sender:'')+'</span></div>';
        if(m.sigs.length){h+='<table class="pt"><thead><tr><th>信号</th><th>起始</th><th>长度</th><th>字节序</th><th>因子</th><th>偏移</th><th>范围</th><th>单位</th></tr></thead><tbody>';m.sigs.forEach(function(s){h+='<tr><td>'+s.n+'</td><td>'+s.sb+'</td><td>'+s.bl+'</td><td>'+(s.bo===1?'Intel':'Moto')+'</td><td>'+s.fc+'</td><td>'+s.of+'</td><td>['+s.mn+'|'+s.mx+']</td><td>'+s.u+'</td></tr>';});h+='</tbody></table>';}else h+='<div style="padding:6px;color:#636366;font-size:9px">无信号</div>';
        h+='</div>';
    });
    if(!h)h='<div class="empty"><div class="ico">📖</div><div class="t1">暂无协议</div></div>';
    v.innerHTML=h;
}

// === 视图切换 ===
function tabView(el,name){
    document.querySelectorAll('.vtab').forEach(function(t){t.classList.remove('on');});el.classList.add('on');
    document.querySelectorAll('.vpanel').forEach(function(p){p.classList.remove('on');});
    document.getElementById('v'+name.charAt(0).toUpperCase()+name.slice(1)).classList.add('on');
}

// === 工具 ===
function doClear(){
    S={asc:[],dbc:[],msgs:{},defs:{},frames:[],sel:null,ci:0,parsed:false,channels:{}};
    ['sF','sI','sS'].forEach(function(id){document.getElementById(id).textContent='0';});
    document.getElementById('sD').textContent='0s';document.getElementById('bGo').disabled=true;document.getElementById('bCsv').disabled=true;
    document.getElementById('pList').innerHTML='<div class="empty" style="height:200px"><div class="ico">📋</div><div class="t2">打开文件开始</div></div>';
    document.getElementById('cA').innerHTML='<div class="empty"><div class="ico">📈</div><div class="t1">暂无波形</div></div>';
    document.getElementById('tTb').innerHTML='';document.getElementById('pV').innerHTML='<div class="empty"><div class="ico">📖</div><div class="t1">暂无协议</div></div>';
    document.getElementById('chBar').innerHTML='<span class="ch-label">CH:</span>';
    document.getElementById('stI').textContent='就绪';
}
function doExport(){if(!S.parsed)return;var csv='时间,CH,ID,DLC,数据\n';S.frames.forEach(function(f){csv+=f.t.toFixed(6)+','+f.ch+',0x'+f.id.toString(16).toUpperCase()+','+f.dl+','+f.d.map(function(b){return('0'+b.toString(16)).slice(-2);}).join(' ')+'\n';});var a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv'}));a.download='can_'+new Date().toISOString().slice(0,10)+'.csv';a.click();}
function mShow(t,b){document.getElementById('mT').textContent=t;document.getElementById('mB').textContent=b;document.getElementById('mBg').classList.add('show');}
function mClose(){document.getElementById('mBg').classList.remove('show');}
window.addEventListener('resize',function(){if(S.sel&&S.msgs[S.sel]){var m=S.msgs[S.sel];var activeCh=getActiveCh();var filtered={id:m.id,name:m.name,dl:m.dl,sigs:m.sigs,vt:m.vt,frames:m.frames.filter(function(f){return activeCh.indexOf(f.ch)>=0;})};renderCharts(filtered);}});
</script>
