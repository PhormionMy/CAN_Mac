<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{
  --safe-top:env(safe-area-inset-top,0px);--safe-bottom:env(safe-area-inset-bottom,0px);
  --mac-traffic:#ff5f57,#febc2e,#28c840;
  --bg-primary:#1e1e1e;--bg-secondary:#252526;--bg-tertiary:#2d2d30;
  --bg-hover:#383838;--bg-active:#094771;
  --border:#3c3c3c;--border-light:#4e4e4e;
  --text-primary:#cccccc;--text-secondary:#969696;--text-muted:#666;
  --accent:#007aff;--accent-hover:#0066d6;
  --green:#34c759;--red:#ff3b30;--orange:#ff9500;--cyan:#5ac8fa;
}
html,body{height:100%;overflow:hidden;background:var(--bg-primary);color:var(--text-primary);font-family:-apple-system,BlinkMacSystemFont,'SF Pro Text','SF Mono','Menlo',monospace;-webkit-text-size-adjust:100%}
body{display:flex;flex-direction:column}
/* Mac title bar */
.mac-titlebar{background:linear-gradient(180deg,#333,#2a2a2a);height:38px;display:flex;align-items:center;padding:0 12px;-webkit-app-region:drag;border-bottom:1px solid #222;flex-shrink:0;position:relative;z-index:100}
.traffic-lights{display:flex;gap:7px;margin-right:14px}
.tl-btn{width:12px;height:12px;border-radius:50%;border:none;cursor:pointer;-webkit-app-region:no-drag}
.tl-close{background:#ff5f57}.tl-minimize{background:#febc2e}.tl-maximize{background:#28c840}
.tl-close:hover{background:#ff3b30}.tl-minimize:hover{background:#e5a820}.tl-maximize:hover{background:#1eae35}
.title-text{flex:1;text-align:center;font-size:13px;color:#aaa;font-weight:500;letter-spacing:.3px}
.title-right{width:70px}
/* Toolbar */
.toolbar{background:var(--bg-secondary);border-bottom:1px solid var(--border);display:flex;align-items:center;padding:4px 8px;gap:4px;flex-shrink:0}
.tb-btn{padding:5px 12px;border-radius:6px;border:1px solid var(--border);background:var(--bg-tertiary);color:var(--text-primary);font-size:12px;cursor:pointer;transition:all .15s;font-family:inherit;display:flex;align-items:center;gap:5px}
.tb-btn:hover{background:var(--bg-hover)}.tb-btn:active{background:var(--bg-active);color:#fff}
.tb-btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.tb-btn.primary:hover{background:var(--accent-hover)}
.tb-sep{width:1px;height:20px;background:var(--border);margin:0 4px}
.tb-info{margin-left:auto;font-size:11px;color:var(--text-muted);display:flex;gap:12px}
.tb-info span{white-space:nowrap}
.tb-info b{color:var(--text-secondary)}
/* Main layout */
.main{flex:1;display:flex;overflow:hidden}
/* Left panel - message list */
.left-panel{width:280px;border-right:1px solid var(--border);display:flex;flex-direction:column;background:var(--bg-secondary);flex-shrink:0}
.panel-header{padding:8px 10px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:6px}
.panel-title{font-size:12px;font-weight:600;color:var(--text-primary);flex:1}
.search-box{padding:6px 10px;border-bottom:1px solid var(--border)}
.search-input{width:100%;padding:5px 8px;border-radius:5px;border:1px solid var(--border);background:var(--bg-tertiary);color:var(--text-primary);font-size:12px;outline:none;font-family:inherit}
.search-input:focus{border-color:var(--accent)}
.msg-list{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch}
.msg-item{display:flex;align-items:center;padding:5px 10px;cursor:pointer;border-bottom:1px solid #2a2a2a;transition:background .1s;gap:8px}
.msg-item:hover{background:var(--bg-hover)}
.msg-item.active{background:var(--bg-active)}
.msg-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.msg-id{font-size:12px;color:var(--cyan);font-weight:600;font-family:'SF Mono',Menlo,monospace;min-width:70px}
.msg-name{font-size:11px;color:var(--text-secondary);flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.msg-cnt{font-size:10px;color:var(--text-muted);flex-shrink:0}
/* Right panel - main view */
.right-panel{flex:1;display:flex;flex-direction:column;overflow:hidden}
.view-tabs{display:flex;background:var(--bg-secondary);border-bottom:1px solid var(--border);flex-shrink:0}
.view-tab{padding:7px 16px;font-size:12px;color:var(--text-muted);cursor:pointer;border-bottom:2px solid transparent;transition:all .15s}
.view-tab:hover{color:var(--text-primary)}
.view-tab.active{color:var(--accent);border-bottom-color:var(--accent)}
.view-content{flex:1;overflow:hidden;position:relative}
/* Waveform view */
.wave-container{position:absolute;inset:0;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch}
.wave-row{border-bottom:1px solid #2a2a2a;position:relative}
.wave-header{display:flex;align-items:center;padding:4px 10px;background:var(--bg-secondary);gap:6px;height:28px}
.wave-label{font-size:11px;color:var(--text-primary);font-weight:500}
.wave-value{font-size:11px;color:var(--cyan);font-family:'SF Mono',Menlo,monospace;margin-left:auto}
.wave-canvas-wrap{position:relative;height:120px;background:#0a0a0a}
.wave-canvas-wrap canvas{width:100%;height:100%;display:block}
/* Data view */
.data-container{position:absolute;inset:0;overflow:auto;-webkit-overflow-scrolling:touch;padding:8px}
.data-table{width:100%;border-collapse:collapse;font-size:11px}
.data-table th{background:var(--bg-tertiary);padding:6px 10px;text-align:left;color:var(--text-muted);font-size:10px;text-transform:uppercase;border-bottom:1px solid var(--border);position:sticky;top:0;z-index:2}
.data-table td{padding:5px 10px;border-bottom:1px solid #2a2a2a;font-family:'SF Mono',Menlo,monospace}
.data-table tr:hover td{background:var(--bg-hover)}
/* Protocol view */
.proto-container{position:absolute;inset:0;overflow:auto;-webkit-overflow-scrolling:touch;padding:8px}
.proto-card{background:var(--bg-secondary);border:1px solid var(--border);border-radius:8px;margin-bottom:8px;overflow:hidden}
.proto-hdr{padding:8px 12px;background:var(--bg-tertiary);display:flex;align-items:center;gap:8px;border-bottom:1px solid var(--border)}
.proto-id{color:var(--cyan);font-weight:700;font-size:13px;font-family:'SF Mono',Menlo,monospace}
.proto-name{color:var(--text-secondary);font-size:12px}
.proto-table{width:100%;border-collapse:collapse;font-size:11px}
.proto-table th{background:var(--bg-tertiary);padding:5px 8px;text-align:left;color:var(--text-muted);font-size:9px;text-transform:uppercase;border-bottom:1px solid var(--border)}
.proto-table td{padding:4px 8px;border-bottom:1px solid #2a2a2a}
/* Signal panel */
.sig-panel{border-top:1px solid var(--border);background:var(--bg-secondary);max-height:200px;overflow-y:auto;flex-shrink:0}
.sig-item{display:flex;align-items:center;padding:3px 10px;gap:6px;cursor:pointer;font-size:11px;border-bottom:1px solid #2a2a2a}
.sig-item:hover{background:var(--bg-hover)}
.sig-item.selected{background:var(--bg-active)}
.sig-dot{width:6px;height:6px;border-radius:50%;flex-shrink:0}
.sig-name{color:var(--text-primary);flex:1}
.sig-val{color:var(--cyan);font-family:'SF Mono',Menlo,monospace;font-size:11px}
/* Status bar */
.statusbar{background:var(--bg-secondary);border-top:1px solid var(--border);padding:3px 12px;display:flex;gap:16px;font-size:11px;color:var(--text-muted);flex-shrink:0}
.statusbar b{color:var(--text-secondary)}
/* Drop overlay */
.drop-overlay{position:fixed;inset:0;background:rgba(0,122,255,.15);border:3px dashed var(--accent);z-index:200;display:none;align-items:center;justify-content:center;pointer-events:none}
.drop-overlay.show{display:flex}
.drop-overlay .drop-text{background:var(--bg-primary);padding:20px 40px;border-radius:12px;font-size:18px;color:var(--accent);font-weight:600}
/* Empty state */
.empty-state{display:flex;flex-direction:column;align-items:center;justify-content:center;height:100%;color:var(--text-muted);gap:8px}
.empty-icon{font-size:48px;opacity:.3}
.empty-text{font-size:14px}
.empty-hint{font-size:12px;color:#555}
/* File list in toolbar */
.file-chips{display:flex;gap:4px;flex-wrap:wrap;max-width:400px}
.file-chip{display:inline-flex;align-items:center;gap:4px;padding:2px 8px;border-radius:4px;background:var(--bg-tertiary);border:1px solid var(--border);font-size:10px;color:var(--text-secondary)}
.file-chip .fc-del{cursor:pointer;color:var(--red);font-weight:700}
/* Hidden file inputs */
.hidden{display:none}
/* Scrollbar */
::-webkit-scrollbar{width:8px;height:8px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:#555;border-radius:4px}
::-webkit-scrollbar-thumb:hover{background:#777}
/* Hex data */
.hex-grid{display:flex;flex-wrap:wrap;gap:4px;padding:8px}
.hex-byte{text-align:center;min-width:40px;padding:3px;border-radius:4px;background:var(--bg-tertiary)}
.hex-byte .ix{font-size:8px;color:#555}
.hex-byte .vl{font-size:13px;color:var(--orange);font-weight:700}
/* Signal selector modal */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:150;display:none;align-items:center;justify-content:center}
.modal-overlay.show{display:flex}
.modal{background:var(--bg-secondary);border:1px solid var(--border);border-radius:12px;width:500px;max-height:80vh;display:flex;flex-direction:column;box-shadow:0 20px 60px rgba(0,0,0,.5)}
.modal-hdr{padding:12px 16px;border-bottom:1px solid var(--border);display:flex;align-items:center}
.modal-title{font-size:14px;font-weight:600;flex:1}

<body>

<!-- Hidden file inputs -->
<input type="file" class="hidden" id="dbcInput" accept=".dbc" multiple>
<input type="file" class="hidden" id="ascInput" accept=".asc,.blf" multiple>

<script>
// ========== State ==========
var S = {
  dbc: {}, lk: {}, msgs: [], dec: {},
  dbcFiles: [], ascFiles: [],
  selId: null, ok: false, idF: {}, chs: []
};
var AXES = []; // waveform axes
var axColors = ['#007aff','#ff3b30','#34c759','#ff9500','#af52de','#5ac8fa','#ff2d55','#ffcc00'];
var axId = 0;
var currentView = 'wave';
var dbcEnums = {};
var builtinDbcs = {};

// ========== Utility ==========
function $(id){ return document.getElementById(id); }
function hex(id){ return ('00000000'+(id>>>0).toString(16)).slice(-8).toUpperCase(); }
function d2c(id){ return id & 0x7FF; } // standard CAN ID
function cc(n){ var cols=['#007aff','#ff3b30','#34c759','#ff9500','#af52de','#5ac8fa','#ff2d55','#ffcc00']; return cols[(n-1)%cols.length]; }
function ac(i){ return axColors[i % axColors.length]; }

// ========== File Handling ==========
function pickFile(type){
  if(type==='dbc') $('dbcInput').click();
  else $('ascInput').click();
}

$('dbcInput').addEventListener('change', function(e){
  for(var i=0;i<e.target.files.length;i++) S.dbcFiles.push(e.target.files[i]);
  e.target.value=''; updateFileChips();
});
$('ascInput').addEventListener('change', function(e){
  for(var i=0;i<e.target.files.length;i++) S.ascFiles.push(e.target.files[i]);
  e.target.value=''; updateFileChips();
});

function updateFileChips(){
  var h='';
  for(var i=0;i<S.dbcFiles.length;i++){
    h+='<span class="file-chip">📘 '+S.dbcFiles[i].name+' <span class="fc-del" onclick="removeFile(\'dbc\','+i+')">✕</span></span>';
  }
  for(var i=0;i<S.ascFiles.length;i++){
    h+='<span class="file-chip">📗 '+S.ascFiles[i].name+' <span class="fc-del" onclick="removeFile(\'asc\','+i+')">✕</span></span>';
  }
  $('fileChips').innerHTML = h;
}

function removeFile(type, idx){
  if(type==='dbc') S.dbcFiles.splice(idx,1);
  else S.ascFiles.splice(idx,1);
  updateFileChips();
}

function readFile(f){ return new Promise(function(resolve,reject){ var r=new FileReader(); r.onload=function(){resolve(r.result)}; r.onerror=reject; r.readAsText(f); }); }
function readBin(f){ return new Promise(function(resolve,reject){ var r=new FileReader(); r.onload=function(){resolve(r.result)}; r.onerror=reject; r.readAsArrayBuffer(f); }); }

// Drag & drop
document.addEventListener('dragover', function(e){ e.preventDefault(); $('dropOverlay').classList.add('show'); });
document.addEventListener('dragleave', function(e){ if(e.relatedTarget===null) $('dropOverlay').classList.remove('show'); });
document.addEventListener('drop', function(e){
  e.preventDefault(); $('dropOverlay').classList.remove('show');
  var files = e.dataTransfer.files;
  for(var i=0;i<files.length;i++){
    var f=files[i], n=f.name.toLowerCase();
    if(n.endsWith('.dbc')) S.dbcFiles.push(f);
    else if(n.endsWith('.asc')||n.endsWith('.blf')) S.ascFiles.push(f);
  }
  updateFileChips();
});

// ========== DBC Parsing ==========
function parseDBC(content){
  if(content.charCodeAt(0)===0xFEFF) content=content.substring(1);
  var ls=content.split(/\r?\n/), mc=0, sc=0, cm=null;
  dbcEnums={};
  var valTables={};
  for(var i=0;i<ls.length;i++){
    var l=ls[i].trim();
    if(l.length<3||l[0]==='/'||l[0]==='#'||l[0]===';') continue;
    // CM_ SG_
    if(l.indexOf('CM_ SG_')===0){
      var cmMatch=l.match(/CM_\s+SG_\s+(\d+)\s+(\S+)\s+"([^"]*)"/);
      if(cmMatch){
        var cmMsgId=+cmMatch[1], cmSigName=cmMatch[2], cmText=cmMatch[3];
        var cmMsgDef=S.dbc[cmMsgId];
        if(cmMsgDef){
          var cmFullName=cmMsgDef.name+'.'+cmSigName;
          if(/[\u4e00-\u9fff]/.test(cmText)) dbcEnums[cmFullName]={values:[],unit:'',description:cmText};
        }
      }
      continue;
    }
    // VAL_TABLE_
    if(l.indexOf('VAL_TABLE_')===0){
      var vtMatch=l.match(/VAL_TABLE_\s+(\S+)\s+(.*?)\s*;\s*$/);
      if(vtMatch){
        var vtName=vtMatch[1], vtRest=vtMatch[2];
        var vtPairs=vtRest.match(/(\d+)\s+"([^"]*)"/g);
        if(vtPairs){
          var vtVals=[];
          for(var vti=0;vti<vtPairs.length;vti++){
            var vtm=vtPairs[vti].match(/(\d+)\s+"([^"]*)"/);
            if(vtm) vtVals.push({num:parseInt(vtm[1]),desc:vtm[2]});
          }
          valTables[vtName]=vtVals;
        }
      }
      continue;
    }
    // VAL_
    if(l.indexOf('VAL_')===0 && l.indexOf('VAL_TABLE_')!==0 && l.indexOf('VAL_ SG_')!==0){
      var valMatch=l.match(/^VAL_\s+(\d+)\s+(\S+)\s+(.*?)\s*;\s*$/);
      if(valMatch){
        var valMsgId=+valMatch[1], valSigName=valMatch[2], valRest=valMatch[3];
        var valPairs=valRest.match(/(\d+)\s+"([^"]*)"/g);
        if(valPairs){
          var valVals=[];
          for(var vi=0;vi<valPairs.length;vi++){
            var vm=valPairs[vi].match(/(\d+)\s+"([^"]*)"/);
            if(vm) valVals.push({num:parseInt(vm[1]),desc:vm[2]});
          }
          var valMsgDef=S.dbc[valMsgId];
          if(valMsgDef){
            var valFullName=valMsgDef.name+'.'+valSigName;
            dbcEnums[valFullName]={values:valVals,unit:'',description:''};
          }
        }
      }
      continue;
    }
    // BO_
    if(l.indexOf('BO_')===0){
      var m=l.match(/BO_\s+(\d+)\s+(\S+)\s*:\s*(\d+)/);
      if(m){
        cm=+m[1]; var nm=m[2], dlc=+m[3], cid=d2c(cm), ch=hex(cid);
        if(!S.dbc[cm]){
          S.dbc[cm]={did:cm,cid:cid,ch:ch,name:nm,dlc:dlc,sigs:[]};
          S.lk[ch]=S.dbc[cm]; mc++;
        }
      }
      continue;
    }
    // SG_
    if(cm!==null && S.dbc[cm]){
      var sl=null;
      if(l.indexOf('SG_')===0) sl=l;
      else if(l.indexOf(' SG_')>=0) sl=l.substring(l.indexOf(' SG_')+1);
      if(sl){
        var ci=sl.indexOf(':'); if(ci<0) continue;
        var sn=sl.substring(3,ci).trim();
        var rest=sl.substring(ci+1).trim();
        var bm=rest.match(/(\d+)\|(\d+)@(\d)([+-])/);
        if(!bm) continue;
        var sb=+bm[1], bl=+bm[2], bo=+bm[3], sg=bm[4];
        rest=rest.substring(bm[0].length).trim();
        var fm=rest.match(/\(\s*([-\d.]+)\s*,\s*([-\d.]+)\s*\)/);
        if(!fm) continue;
        var factor=+fm[1], offset=+fm[2], mn=null, mx=null;
        var rm=rest.match(/\[\s*([-\d.]*)\s*\|\s*([-\d.]*)\s*\]/);
        if(rm){ if(rm[1]!=='') mn=+rm[1]; if(rm[2]!=='') mx=+rm[2]; }
        var unit='', um=rest.match(/"([^"]*)"/);
        if(um) unit=um[1];
        S.dbc[cm].sigs.push({
          name:sn, full:S.dbc[cm].name+'.'+sn, msg:S.dbc[cm].name,
          start:sb, len:bl, order:bo, sign:sg==='+',
          scale:factor, offset:offset, min:mn, max:mx, unit:unit
        });
        sc++;
      }
    }
  }
  // Apply VAL_TABLE_ references
  for(var ek in dbcEnums){
    if(dbcEnums.hasOwnProperty(ek)){
      var ev=dbcEnums[ek];
      if(ev.values.length===1 && valTables[ev.values[0].desc]){
        dbcEnums[ek]={values:valTables[ev.values[0].desc],unit:ev.unit||'',description:ev.description||''};
      }
    }
  }
  for(var k in S.dbc){
    if(S.dbc[k].sigs.length>1) S.dbc[k].sigs.sort(function(a,b){return a.start-b.start});
  }
  return {m:mc, s:sc};
}

// ========== ASC Parsing ==========
function parseASC(content){
  var ls=content.split(/\r?\n/), msgs=[], sk=0;
  for(var i=0;i<ls.length;i++){
    var l=ls[i].trim();
    if(l.length<10){sk++;continue}
    var c0=l.charCodeAt(0);
    if(c0<45||c0>57){sk++;continue}
    var p=l.split(/\s+/);
    if(p.length<7){sk++;continue}
    var ts=parseFloat(p[0]); if(isNaN(ts)){sk++;continue}
    var ch=parseInt(p[1],10); if(isNaN(ch)) ch=1;
    var idStr=p[2];
    if(idStr.slice(-1)==='x'||idStr.slice(-1)==='X') idStr=idStr.slice(0,-1);
    var id=parseInt(idStr,16); if(isNaN(id)){sk++;continue}
    var di=-1;
    for(var j=3;j<p.length;j++){if(p[j]==='d'||p[j]==='D'){di=j;break}}
    if(di<0||di+1>=p.length){sk++;continue}
    var dlc=parseInt(p[di+1],10);
    if(isNaN(dlc)||dlc<0||dlc>64){sk++;continue}
    var data=[];
    for(var k=di+2;k<p.length&&data.length<dlc;k++){
      var v=parseInt(p[k],16); if(!isNaN(v)) data.push(v);
    }
    while(data.length<dlc) data.push(0);
    msgs.push({ts:ts,ch:ch,id:id,idH:hex(d2c(id)),dlc:dlc,data:data});
  }
  msgs.sort(function(a,b){return a.ts-b.ts});
  return msgs;
}

// ========== BLF Parsing ==========
function parseBLF(buf){
  var u8=new Uint8Array(buf), len=buf.byteLength, dv=new DataView(buf);
  if(len<144) return [];
  var sig=String.fromCharCode(u8[0],u8[1],u8[2],u8[3]);
  if(sig!=='LOGG') return [];
  var pos=144, msgs=[];
  while(pos+16<=len){
    var osig=String.fromCharCode(u8[pos],u8[pos+1],u8[pos+2],u8[pos+3]);
    if(osig!=='LOBJ'){pos++;continue}
    var hdrSize=dv.getUint16(pos+4,true);
    var objSize=dv.getUint32(pos+8,true);
    var objType=dv.getUint32(pos+12,true);
    if(objSize<16||objSize>100000000){pos++;continue}
    var pad=objSize%4;
    if(objType===10){
      var raw=null;
      if(pos+32<=len){
        var method=dv.getUint16(pos+16,true);
        var containerData=buf.slice(pos+32,pos+objSize);
        if(method===0){raw=new Uint8Array(containerData)}
        else if((method===2||method===1)&&typeof pako!=='undefined'){
          try{raw=pako.inflate(new Uint8Array(containerData))}catch(e){
            try{raw=pako.inflate(new Uint8Array(buf.slice(pos+16,pos+objSize)))}catch(e2){raw=null}
          }
        }
      }
      if(!raw||raw.length===0){
        var allData=new Uint8Array(buf.slice(pos+16,pos+objSize));
        if(allData.length>16) raw=allData;
      }
      if(raw&&raw.length>16){
        var inner=parseBLFContainer(raw);
        if(inner.length>0) msgs=msgs.concat(inner);
      }
    }else{
      parseBLFObj(dv,u8,msgs,objType,pos+hdrSize,len,0);
    }
    pos+=objSize+pad;
  }
  msgs.sort(function(a,b){return a.ts-b.ts});
  return msgs;
}

function parseBLFObj(dv,u8,msgs,objType,dp,len,ts){
  if(objType===1 && dp+16<=len){
    var ch=dv.getUint16(dp,true), dlc=dv.getUint8(dp+3);
    var arbId=dv.getUint32(dp+4,true);
    var data=[];
    for(var d=0;d<dlc&&d<8&&dp+8+d<len;d++) data.push(u8[dp+8+d]);
    msgs.push({ts:ts,ch:ch+1,id:arbId,idH:hex(d2c(arbId)),dlc:dlc,data:data});
  }else if(objType===86 && dp+8<=len){
    var ch2=u8[dp], dlc2=u8[dp+3];
    var arbId2=dv.getUint32(dp+4,true)&0x1FFFFFFF;
    var data2=[];
    for(var d2=0;d2<dlc2&&d2<8&&dp+8+d2<len;d2++) data2.push(u8[dp+8+d2]);
    msgs.push({ts:ts,ch:ch2+1,id:arbId2,idH:hex(d2c(arbId2)),dlc:dlc2,data:data2});
  }else if((objType===100||objType===101) && dp+24<=len){
    var chf=dv.getUint16(dp,true), dlcf=dv.getUint8(dp+3);
    var arbIdf=dv.getUint32(dp+4,true);
    var dLen=dlcf<=8?dlcf:(dlcf<=12?16:(dlcf<=16?20:(dlcf<=20?24:(dlcf<=24?32:(dlcf<=32?48:64)))));
    var dataf=[];
    var fDataStart=objType===101?dp+16:dp+12;
    for(var df=0;df<dLen&&fDataStart+df<len;df++) dataf.push(u8[fDataStart+df]);
    msgs.push({ts:ts,ch:chf+1,id:arbIdf,idH:hex(d2c(arbIdf)),dlc:dlcf,data:dataf});
  }
}

function parseBLFContainer(u8){
  var dv=new DataView(u8.buffer,u8.byteOffset,u8.byteLength);
  var msgs=[], pos=0, len=u8.length;
  while(pos+16<=len){
    if(u8[pos]!==0x4C||u8[pos+1]!==0x4F||u8[pos+2]!==0x42||u8[pos+3]!==0x4A){pos++;continue}
    var hdrSize=dv.getUint16(pos+4,true);
    var objSize=dv.getUint32(pos+8,true);
    var objType=dv.getUint32(pos+12,true);
    if(objSize<16||objSize>1000000){pos++;continue}
    var ts=0;
    if(hdrSize>=32 && pos+32<=len){
      var tsLo=dv.getUint32(pos+24,true);
      var tsHi=dv.getUint32(pos+28,true);
      var rawTs=tsHi*4294967296+tsLo;
      if(rawTs>1e15) ts=rawTs/1000000000.0;
      else ts=rawTs/100000.0;
      if(ts>62135596800) ts-=62135596800.0;
    }
    var dp=pos+hdrSize;
    parseBLFObj(dv,u8,msgs,objType,dp,len,ts);
    var pad=objSize%4;
    pos+=objSize+pad;
  }
  return msgs;
}

// ========== Signal Decoding ==========
function extractBits(data, start, len, order){
  var raw=0;
  for(var b=0;b<len;b++){
    var bi;
    if(order===1) bi=start+b; // Intel (little-endian)
    else bi=start+(len-1-b); // Motorola (big-endian)
    var byteIdx=bi>>3, bitIdx=bi&7;
    if(byteIdx>=0 && byteIdx<data.length){
      var bit=(data[byteIdx]>>bitIdx)&1;
      raw|=(bit<<b);
    }
  }
  return raw;
}

function decodeSignal(msg, sig){
  if(!msg.data || msg.data.length<1) return null;
  var raw = extractBits(msg.data, sig.start, sig.len, sig.order);
  if(sig.sign && raw>>(sig.len-1)) raw-=(1<<sig.len);
  return raw * sig.scale + sig.offset;
}

// ========== Decode All Signals ==========
function decodeAllSignals(){
  S.dec = {};
  var msgs = filteredMsgs();
  for(var i=0;i<msgs.length;i++){
    var msg=msgs[i], def=S.lk[msg.idH];
    if(!def || !def.sigs.length) continue;
    for(var j=0;j<def.sigs.length;j++){
      var sig=def.sigs[j];
      var raw=extractBits(msg.data, sig.start, sig.len, sig.order);
      if(sig.sign && raw>>(sig.len-1)) raw-=(1<<sig.len);
      var phys=raw*sig.scale+sig.offset;
      if(!S.dec[sig.full]) S.dec[sig.full]=[];
      S.dec[sig.full].push({t:msg.ts, v:phys});
    }
  }
}

function filteredMsgs(){
  return S.msgs; // could add channel filtering later
}

// ========== Parse All ==========
function parseAll(){
  if(!S.dbcFiles.length && !S.ascFiles.length) return;
  S.dbc={}; S.lk={}; S.msgs=[]; S.dec={}; S.selId=null; S.ok=false;
  AXES=[]; axId=0;

  var dbcPromises = S.dbcFiles.map(function(f){ return readFile(f); });
  var ascPromises = S.ascFiles.map(function(f){
    if(/\.blf$/i.test(f.name)) return readBin(f).then(function(buf){ return {data:buf,blf:true,name:f.name}; });
    return readFile(f).then(function(txt){ return {data:txt,blf:false,name:f.name}; });
  });

  Promise.all(dbcPromises).then(function(dbcContents){
    var mc=0,sc=0;
    for(var i=0;i<dbcContents.length++){
      var r=parseDBC(dbcContents[i]); mc+=r.m; sc+=r.s;
    }
    return Promise.all(ascPromises);
  }).then(function(ascResults){
    for(var i=0;i<ascResults.length;i++){
      var r=ascResults[i];
      var parsed = r.blf ? parseBLF(r.data) : parseASC(r.data);
      S.msgs=S.msgs.concat(parsed);
    }
    S.msgs.sort(function(a,b){return a.ts-b.ts});

    // Build ID index
    S.idF={};
    for(var i=0;i<S.msgs.length;i++){
      var h=S.msgs[i].idH;
      if(!S.idF[h]) S.idF[h]=[];
      S.idF[h].push(i);
    }

    decodeAllSignals();
    S.ok=true;

    // Update stats
    var msgs=filteredMsgs();
    $('statFrames').textContent=msgs.length;
    var ids={}; for(var i=0;i<msgs.length;i++) ids[msgs[i].idH]=1;
    $('statIds').textContent=Object.keys(ids).length;
    var sc=0; for(var k in S.dbc) sc+=S.dbc[k].sigs.length;
    $('statSigs').textContent=sc;
    if(msgs.length>1) $('statDur').textContent=(msgs[msgs.length-1].ts-msgs[0].ts).toFixed(3)+'s';

    $('idCount').textContent=Object.keys(S.idF).length+' IDs';
    renderIdList();
    renderProtoView();
    renderLegend();

    // Auto-select first few signals for waveform
    autoSelectSignals();
    renderWaveform();
    renderSigPanel();
  }).catch(function(e){ console.error('Parse error:',e); });
}

// ========== Auto-select signals ==========
function autoSelectSignals(){
  AXES=[];
  var sigNames=Object.keys(S.dec);
  var count=Math.min(3, sigNames.length);
  for(var i=0;i<count;i++){
    var name=sigNames[i];
    var sig=null;
    for(var mid in S.dbc){
      for(var j=0;j<S.dbc[mid].sigs.length;j++){
        if(S.dbc[mid].sigs[j].full===name){sig=S.dbc[mid].sigs[j];break}
      }
      if(sig)break;
    }
    AXES.push({id:axId++, name:name, color:axColors[i%axColors.length], visible:true, sig:sig});
  }
  renderLegend();
}

// ========== ID List ==========
function renderIdList(){
  var msgs=filteredMsgs(), cnt={};
  for(var i=0;i<msgs.length;i++){
    var k=msgs[i].idH;
    if(!cnt[k]) cnt[k]={n:0};
    cnt[k].n++;
  }
  var el=$('idList'), h='', sorted=Object.keys(cnt).sort(), fl=$('idSearch').value.toLowerCase();
  for(var i=0;i<sorted.length;i++){
    var idH=sorted[i], def=S.lk[idH];
    if(fl && idH.toLowerCase().indexOf(fl)<0 && !(def && def.name.toLowerCase().indexOf(fl)>=0)) continue;
    h+='<div class="msg-item'+(S.selId===idH?' active':'')+'" data-id="'+idH+'" onclick="selectId(\''+idH+'\')">';
    h+='<span class="msg-dot" style="background:'+ac(i)+'"></span>';
    h+='<span class="msg-id">0x'+idH+'</span>';
    h+='<span class="msg-name">'+(def?def.name:'')+'</span>';
    h+='<span class="msg-cnt">'+cnt[idH].n+'</span>';
    h+='</div>';
  }
  el.innerHTML=h||'<div style="color:#555;font-size:11px;text-align:center;padding:20px">无数据</div>';
}

function selectId(idH){
  S.selId = S.selId===idH ? null : idH;
  renderIdList();
  renderDataView();
  renderSigPanel();
}

// ========== View Switching ==========
function switchView(view){
  currentView=view;
  document.querySelectorAll('.view-tab').forEach(function(t){
    t.classList.toggle('active', t.dataset.view===view);
  });
  $('waveView').style.display=view==='wave'?'':'none';
  $('dataView').style.display=view==='data'?'':'none';
  $('protoView').style.display=view==='proto'?'':'none';
}

// ========== Legend ==========
function renderLegend(){
  var bar=$('legendBar'), h='';
  for(var i=0;i<AXES.length;i++){
    var ax=AXES[i];
    h+='<span class="legend-item'+(ax.visible?'':' hidden')+'" onclick="toggleAxis('+ax.id+')" style="border-color:'+ax.color+'44">';
    h+='<span class="legend-dot" style="background:'+ax.color+'"></span>';
    h+='<span class="legend-name">'+ax.name+'</span>';
    h+='</span>';
  }
  h+='<span class="legend-item" onclick="openSigModal()" style="border-style:dashed;color:var(--accent)">+ 添加信号</span>';
  bar.innerHTML=h;
}

function toggleAxis(id){
  for(var i=0;i<AXES.length;i++){
    if(AXES[i].id===id){AXES[i].visible=!AXES[i].visible;break}
  }
  renderLegend();
  renderWaveform();
}

// ========== Waveform Rendering ==========
function renderWaveform(){
  var container=$('waveRows');
  var h='';
  for(var i=0;i<AXES.length;i++){
    var ax=AXES[i];
    if(!ax.visible) continue;
    var points=S.dec[ax.name]||[];
    var lastVal=points.length?points[points.length-1].v.toFixed(2):'-';
    h+='<div class="wave-row">';
    h+='<div class="wave-header">';
    h+='<span class="wave-label" style="color:'+ax.color+'">● '+ax.name+'</span>';
    h+='<span class="wave-value">'+lastVal+' '+(ax.sig?ax.sig.unit:'')+'</span>';
    h+='</div>';
    h+='<div class="wave-canvas-wrap"><canvas id="wc'+ax.id+'" width="800" height="120"></canvas></div>';
    h+='</div>';
  }
  if(!AXES.length||!AXES.some(function(a){return a.visible})){
    h='<div class="empty-state"><div class="empty-icon">📈</div><div class="empty-text">添加信号以查看波形</div><div class="empty-hint">点击下方信号面板或图例中的"+ 添加信号"</div></div>';
  }
  container.innerHTML=h;

  // Draw each canvas
  for(var i=0;i<AXES.length;i++){
    var ax=AXES[i];
    if(!ax.visible) continue;
    drawWaveCanvas(ax);
  }
}

function drawWaveCanvas(ax){
  var canvas=$('wc'+ax.id);
  if(!canvas) return;
  var ctx=canvas.getContext('2d');
  var W=canvas.width=canvas.parentElement.clientWidth*2;
  var H=canvas.height=240;
  ctx.clearRect(0,0,W,H);

  var points=S.dec[ax.name]||[];
  if(points.length<2){
    ctx.fillStyle='#555';ctx.font='20px -apple-system';ctx.textAlign='center';
    ctx.fillText('无数据',W/2,H/2);
    return;
  }

  // Find data range
  var minV=Infinity,maxV=-Infinity;
  for(var i=0;i<points.length;i++){
    if(points[i].v<minV) minV=points[i].v;
    if(points[i].v>maxV) maxV=points[i].v;
  }
  if(minV===maxV){minV-=1;maxV+=1}
  var range=maxV-minV;
  var t0=points[0].t, t1=points[points.length-1].t;
  var tRange=t1-t0; if(tRange<=0) tRange=1;

  // Grid
  ctx.strokeStyle='#1a1a2a';ctx.lineWidth=1;
  for(var g=0;g<5;g++){
    var y=H*0.1+(H*0.8)*g/4;
    ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(W,y);ctx.stroke();
  }

  // Draw waveform
  ctx.strokeStyle=ax.color;ctx.lineWidth=2;ctx.beginPath();
  for(var i=0;i<points.length;i++){
    var x=((points[i].t-t0)/tRange)*W;
    var y=H*0.9-((points[i].v-minV)/range)*H*0.8;
    if(i===0) ctx.moveTo(x,y);
    else ctx.lineTo(x,y);
  }
  ctx.stroke();

  // Fill area
  ctx.globalAlpha=0.1;
  ctx.fillStyle=ax.color;
  ctx.lineTo(W,H);ctx.lineTo(0,H);ctx.closePath();ctx.fill();
  ctx.globalAlpha=1;

  // Min/Max labels
  ctx.fillStyle='#666';ctx.font='18px -apple-system';
  ctx.fillText(maxV.toFixed(1),8,22);
  ctx.fillText(minV.toFixed(1),8,H-6);
}

// ========== Data View ==========
function renderDataView(){
  if(!S.selId){
    $('dataEmpty').style.display='';
    $('dataContent').style.display='none';
    return;
  }
  $('dataEmpty').style.display='none';
  $('dataContent').style.display='';

  var def=S.lk[S.selId];
  var idIdxs=S.idF[S.selId]||[];
  var h='<h3 style="color:var(--cyan);margin-bottom:10px;font-size:14px">0x'+S.selId+' '+(def?def.name:'')+'</h3>';

  // Signal table
  if(def && def.sigs.length){
    h+='<table class="data-table"><thead><tr><th>信号</th><th>原始值</th><th>物理值</th><th>单位</th><th>起始位</th><th>长度</th></tr></thead><tbody>';
    var lastIdx=idIdxs[idIdxs.length-1];
    var lastMsg=S.msgs[lastIdx];
    for(var j=0;j<def.sigs.length;j++){
      var sig=def.sigs[j];
      var raw=extractBits(lastMsg.data,sig.start,sig.len,sig.order);
      if(sig.sign && raw>>(sig.len-1)) raw-=(1<<sig.len);
      var phys=raw*sig.scale+sig.offset;
      h+='<tr><td style="color:var(--text-primary)">'+sig.name+'</td>';
      h+='<td style="color:var(--orange)">'+raw+'</td>';
      h+='<td style="color:var(--cyan)">'+phys.toFixed(2)+'</td>';
      h+='<td>'+sig.unit+'</td>';
      h+='<td>'+sig.start+'</td>';
      h+='<td>'+sig.len+'</td></tr>';
    }
    h+='</tbody></table>';
  }

  // Raw hex data
  h+='<h4 style="color:var(--text-secondary);margin:12px 0 6px;font-size:12px">原始数据 (最新帧)</h4>';
  if(idIdxs.length>0){
    var lastMsg=S.msgs[idIdxs[idIdxs.length-1]];
    h+='<div class="hex-grid">';
    for(var b=0;b<lastMsg.data.length;b++){
      h+='<div class="hex-byte"><span class="ix">B'+b+'</span><span class="vl">'+('0'+lastMsg.data[b].toString(16)).slice(-2).toUpperCase()+'</span></div>';
    }
    h+='</div>';
  }

  $('dataContent').innerHTML=h;
}

// ========== Protocol View ==========
function renderProtoView(){
  var keys=Object.keys(S.dbc);
  if(!keys.length){
    $('protoEmpty').style.display='';
    $('protoContent').style.display='none';
    return;
  }
  $('protoEmpty').style.display='none';
  $('protoContent').style.display='';

  var h='';
  keys.sort(function(a,b){return (+a)-(+b)});
  for(var i=0;i<keys.length;i++){
    var msg=S.dbc[keys[i]];
    h+='<div class="proto-card">';
    h+='<div class="proto-hdr"><span class="proto-id">0x'+msg.ch+'</span><span class="proto-name">'+msg.name+'</span><span style="margin-left:auto;color:#555;font-size:10px">DLC:'+msg.dlc+' ID:'+msg.did+'</span></div>';
    if(msg.sigs.length){
      h+='<table class="proto-table"><thead><tr><th>信号</th><th>起始位</th><th>长度</th><th>字节序</th><th>因子</th><th>偏移</th><th>范围</th><th>单位</th></tr></thead><tbody>';
      for(var j=0;j<msg.sigs.length;j++){
        var sig=msg.sigs[j];
        h+='<tr><td style="color:var(--text-primary)">'+sig.name+'</td>';
        h+='<td>'+sig.start+'</td><td>'+sig.len+'</td>';
        h+='<td>'+(sig.order===1?'Intel':'Motorola')+'</td>';
        h+='<td>'+sig.scale+'</td><td>'+sig.offset+'</td>';
        h+='<td>'+(sig.min!==null?'['+sig.min+'|'+sig.max+']':'')+'</td>';
        h+='<td>'+sig.unit+'</td></tr>';
      }
      h+='</tbody></table>';
    }
    h+='</div>';
  }
  $('protoContent').innerHTML=h;
}

// ========== Signal Panel ==========
function renderSigPanel(){
  var el=$('sigPanel'), h='';
  if(!S.selId || !S.lk[S.selId]){
    el.innerHTML='<div style="padding:10px;color:#555;font-size:11px;text-align:center">选择报文查看信号</div>';
    return;
  }
  var def=S.lk[S.selId];
  var idIdxs=S.idF[S.selId]||[];
  var lastMsg=idIdxs.length?S.msgs[idIdxs[idIdxs.length-1]]:null;

  for(var j=0;j<def.sigs.length;j++){
    var sig=def.sigs[j];
    var val='-';
    if(lastMsg){
      var raw=extractBits(lastMsg.data,sig.start,sig.len,sig.order);
      if(sig.sign && raw>>(sig.len-1)) raw-=(1<<sig.len);
      val=(raw*sig.scale+sig.offset).toFixed(2);
    }
    var isOnChart=AXES.some(function(a){return a.name===sig.full});
    h+='<div class="sig-item'+(isOnChart?' selected':'')+'" onclick="toggleSignalOnChart(\''+sig.full.replace(/'/g,"\\'")+'\')">';
    h+='<span class="sig-dot" style="background:'+(isOnChart?axColors[AXES.findIndex(function(a){return a.name===sig.full})%axColors.length]:'#555')+'"></span>';
    h+='<span class="sig-name">'+sig.name+'</span>';
    h+='<span class="sig-val">'+val+' '+sig.unit+'</span>';
    h+='</div>';
  }
  el.innerHTML=h;
}

function toggleSignalOnChart(sigName){
  var idx=-1;
  for(var i=0;i<AXES.length;i++){if(AXES[i].name===sigName){idx=i;break}}
  if(idx>=0){
    AXES.splice(idx,1);
  }else{
    var sig=null;
    for(var mid in S.dbc){
      for(var j=0;j<S.dbc[mid].sigs.length;j++){
        if(S.dbc[mid].sigs[j].full===sigName){sig=S.dbc[mid].sigs[j];break}
      }
      if(sig)break;
    }
    AXES.push({id:axId++, name:sigName, color:axColors[AXES.length%axColors.length], visible:true, sig:sig});
  }
  renderLegend();
  renderWaveform();
  renderSigPanel();
}

// ========== Signal Selector Modal ==========
function openSigModal(){
  var body=$('sigModalBody'), h='';
  var allSigs=[];
  for(var mid in S.dbc){
    var msg=S.dbc[mid];
    for(var j=0;j<msg.sigs.length;j++){
      allSigs.push(msg.sigs[j]);
    }
  }
  for(var i=0;i<allSigs.length;i++){
    var sig=allSigs[i];
    var isActive=AXES.some(function(a){return a.name===sig.full});
    h+='<div class="modal-sig'+(isActive?' active':'')+'" onclick="toggleSigModal(\''+sig.full.replace(/'/g,"\\'")+'\')">';
    h+='<span class="ms-dot" style="background:'+(isActive?axColors[AXES.findIndex(function(a){return a.name===sig.full})%axColors.length]:'#555')+'"></span>';
    h+='<span class="ms-name">'+sig.full+'</span>';
    h+='<span class="ms-unit">'+sig.unit+'</span>';
    h+='</div>';
  }
  body.innerHTML=h||'<div style="padding:20px;color:#555;text-align:center">无信号定义</div>';
  $('sigModal').classList.add('show');
}

function closeSigModal(){$('sigModal').classList.remove('show')}

function toggleSigModal(sigName){
  toggleSignalOnChart(sigName);
  openSigModal(); // refresh
}

// ========== Resize handling ==========
window.addEventListener('resize', function(){
  if(S.ok) renderWaveform();
});

// ========== Init ==========
updateFileChips();
</script>
